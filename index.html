<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>COOKED - The 12h Arena</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body { background-color: #0b0e14; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    @keyframes screenShake {
      0% { transform: translate(2px, 1px) rotate(0deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }
    .shake-active { animation: screenShake 0.35s infinite; }
  </style>
</head>
<body class="flex justify-center min-h-screen">

<div id="root" class="w-full max-w-md min-h-screen flex flex-col bg-[#0f141c] border-x border-[#1c2433] relative pb-16"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// --- CONFIGURATION: PASTE YOUR SUPABASE KEYS HERE ---
const SUPABASE_URL = "https://bivhoztjletdxhyehonx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpdmhvenRqbGV0ZHhoeWVob254Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MTgzNzksImV4cCI6MjEwNjE5NDM3OX0.l9gXu35qxhYLUf2cVXXL4KUEH20rE7aOld5D1iGz7hE";

const isSupabaseConfigured = SUPABASE_URL !== "YOUR_SUPABASE_URL" && SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY";
const supabase = isSupabaseConfigured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

function App() {
  const [tab, setTab] = useState('duel'); // duel | cook | hall | admin
  const [adminPinInput, setAdminPinInput] = useState('');
  const [isAdminAuth, setIsAdminAuth] = useState(false);
  const [flameTaps, setFlameTaps] = useState(0);

  // App Master Controls
  const [submissionsOpen, setSubmissionsOpen] = useState(true);
  const [votingOpen, setVotingOpen] = useState(true);
  const [maintenanceMode, setMaintenanceMode] = useState(false);
  const [adminBroadcast, setAdminBroadcast] = useState('');
  const [activeImage, setActiveImage] = useState('https://images.unsplash.com/photo-1543852786-1cf6624b9987?w=800');

  // Interactive Chaos
  const [isShaking, setIsShaking] = useState(false);
  const [screenSticker, setScreenSticker] = useState(null);

  // User Stats & Onboarding
  const [showTutorial, setShowTutorial] = useState(false);
  const [tutorialStep, setTutorialStep] = useState(0);
  const [heatPoints, setHeatPoints] = useState(() => parseInt(localStorage.getItem('heat_points') || '25', 10));
  const [votedChoice, setVotedChoice] = useState(null);

  // Data & Captions
  const [captions, setCaptions] = useState([]);
  const [pairIndices, setPairIndices] = useState([0, 1]);
  const [pendingText, setPendingText] = useState('');
  const [showTermsModal, setShowTermsModal] = useState(false);
  const [hasAgreedTerms, setHasAgreedTerms] = useState(() => localStorage.getItem('agreed_terms') === 'true');

  // Check first launch for tutorial
  useEffect(() => {
    if (!localStorage.getItem('has_launched')) {
      setShowTutorial(true);
      localStorage.setItem('has_launched', 'true');
    }
    loadAppData();
  }, []);

  // Fetch Database State
  const loadAppData = async () => {
    if (!isSupabaseConfigured) {
      setCaptions([
        { id: '1', author: '@SnoopChef', text: 'Me checking the fridge for the 4th time hoping new snacks spawned', wins: 84, losses: 16, flagged: false },
        { id: '2', author: '@ToastGod', text: 'My last brain cell calculating 7 + 8 on my fingers during an exam', wins: 62, losses: 38, flagged: false },
        { id: '3', author: '@MidnightCat', text: 'Walking past the microwave with 00:01 on the timer like a bomb technician', wins: 41, losses: 29, flagged: false },
        { id: '4', author: '@SpamBot', text: 'CLICK HERE TO WIN FREE MONEY NO VIRUS 100%', wins: 1, losses: 99, flagged: true }
      ]);
      return;
    }

    try {
      // Load Config
      const { data: config } = await supabase.from('app_config').select('*').eq('id', 1).single();
      if (config) {
        setSubmissionsOpen(config.submissions_open);
        setVotingOpen(config.voting_open);
        setMaintenanceMode(config.maintenance_mode);
        setAdminBroadcast(config.admin_broadcast || '');
        if (config.active_image) setActiveImage(config.active_image);
      }

      // Load Captions
      const { data: caps } = await supabase.from('captions').select('*').order('created_at', { ascending: false });
      if (caps && caps.length >= 2) {
        setCaptions(caps);
      }
    } catch (err) {
      console.error('Data sync failed:', err);
    }
  };

  // Sync Master Config to Database
  const updateGlobalConfig = async (newConfig) => {
    if (!isSupabaseConfigured) return;
    await supabase.from('app_config').update(newConfig).eq('id', 1);
  };

  const handleVote = async (choice) => {
    if (!votingOpen || votedChoice !== null || captions.length < 2) return;
    setVotedChoice(choice);
    const updatedHeat = heatPoints + 1;
    setHeatPoints(updatedHeat);
    localStorage.setItem('heat_points', updatedHeat.toString());

    const winnerIndex = choice === 'A' ? pairIndices[0] : pairIndices[1];
    const loserIndex = choice === 'A' ? pairIndices[1] : pairIndices[0];

    if (isSupabaseConfigured) {
      const winner = captions[winnerIndex];
      const loser = captions[loserIndex];
      if (winner) await supabase.from('captions').update({ wins: (winner.wins || 0) + 1 }).eq('id', winner.id);
      if (loser) await supabase.from('captions').update({ losses: (loser.losses || 0) + 1 }).eq('id', loser.id);
    }
  };

  const nextPair = () => {
    setVotedChoice(null);
    if (captions.length >= 2) {
      const idxA = Math.floor(Math.random() * captions.length);
      let idxB = Math.floor(Math.random() * captions.length);
      while (idxB === idxA) idxB = Math.floor(Math.random() * captions.length);
      setPairIndices([idxA, idxB]);
    }
  };

  const submitCaption = async () => {
    if (!pendingText.trim()) return;
    const newEntry = { author: `@Chef_${Math.floor(1000 + Math.random() * 9000)}`, text: pendingText.trim(), wins: 0, losses: 0, flagged: false };

    if (isSupabaseConfigured) {
      const { data } = await supabase.from('captions').insert([newEntry]).select();
      if (data) setCaptions([data[0], ...captions]);
    } else {
      setCaptions([{ ...newEntry, id: Date.now().toString() }, ...captions]);
    }

    setPendingText('');
    setHeatPoints(h => h + 10);
    alert('Served to the global queue!');
    setTab('duel');
  };

  const triggerAdminShake = () => {
    setIsShaking(true);
    setTimeout(() => setIsShaking(false), 2500);
  };

  const triggerAdminConfetti = () => {
    if (window.confetti) window.confetti({ particleCount: 160, spread: 80, origin: { y: 0.6 } });
  };

  const capA = captions[pairIndices[0]] || captions[0];
  const capB = captions[pairIndices[1]] || captions[1];

  const totalVotesA = (capA?.wins || 0) + (capA?.losses || 0);
  const totalVotesB = (capB?.wins || 0) + (capB?.losses || 0);
  const percentA = totalVotesA + totalVotesB === 0 ? 50 : Math.round((totalVotesA / (totalVotesA + totalVotesB)) * 100);
  const percentB = 100 - percentA;

  return (
    <div class={`flex-1 flex flex-col justify-between ${isShaking ? 'shake-active' : ''}`}>

      {/* Global Admin Broadcast */}
      {adminBroadcast && (
        <div class="bg-red-600 px-4 py-2 text-center text-xs font-black tracking-wide text-white flex justify-between items-center shadow-lg">
          <span class="flex items-center space-x-1.5"><i class="fa-solid fa-bullhorn text-[11px]"></i> <span>{adminBroadcast}</span></span>
          <button onClick={() => { setAdminBroadcast(''); updateGlobalConfig({ admin_broadcast: '' }); }} class="text-white ml-2"><i class="fa-solid fa-xmark"></i></button>
        </div>
      )}

      {/* Live Warning if not connected */}
      {!isSupabaseConfigured && (
        <div class="bg-amber-600/20 border-b border-amber-500/30 px-3 py-1 text-center text-[10px] text-amber-400 font-mono">
          <i class="fa-solid fa-circle-exclamation mr-1"></i> Running local preview mode. Add Supabase keys to enable live multiplayer sync.
        </div>
      )}

      {/* App Header */}
      <header class="p-4 flex items-center justify-between border-b border-[#1c2433] bg-[#141a24]">
        <div class="flex items-center space-x-2">
          <button
            onClick={() => {
              const next = flameTaps + 1;
              if (next >= 3) { setFlameTaps(0); setTab('admin'); }
              else { setFlameTaps(next); setTimeout(() => setFlameTaps(0), 1200); }
            }}
            class="text-xl font-black text-orange-500 tracking-wider flex items-center space-x-1 active:scale-95 transition"
          >
            <i class="fa-solid fa-fire-flame-curved text-orange-500"></i>
            <span>COOKED</span>
          </button>
          <span class="text-[10px] bg-[#222b3b] px-2 py-0.5 rounded text-gray-400 font-mono font-bold">LIVE</span>
        </div>
        <div class="flex items-center space-x-3 text-sm">
          <span class="flex items-center space-x-1 text-orange-400 font-bold bg-[#1d2535] px-2.5 py-1 rounded-full border border-orange-500/20">
            <i class="fa-solid fa-fire text-xs"></i>
            <span>{heatPoints}</span>
          </span>
          <span class="bg-[#1d2535] text-xs px-2.5 py-1 rounded-full text-gray-300 font-mono border border-gray-700">
            <i class="fa-regular fa-clock mr-1 text-gray-400"></i>04:18:22
          </span>
        </div>
      </header>

      {/* Maintenance Lockout Screen */}
      {maintenanceMode && tab !== 'admin' ? (
        <div class="flex-1 flex flex-col items-center justify-center p-6 text-center">
          <i class="fa-solid fa-screwdriver-wrench text-5xl text-orange-400 mb-4"></i>
          <h2 class="text-xl font-black mb-2 text-white">Emergency Maintenance</h2>
          <p class="text-gray-400 text-xs">The chef is cleaning the kitchen floor. Arena voting will reopen shortly.</p>
        </div>
      ) : (
        <main class="flex-1 flex flex-col p-4 overflow-y-auto">

          {/* TAB 1: ARENA DUEL SCREEN */}
          {tab === 'duel' && (
            <div class="flex-1 flex flex-col justify-between space-y-4">
              <div class="relative w-full h-64 bg-black rounded-2xl overflow-hidden border border-[#232d40] shadow-xl">
                <img src={activeImage} class="w-full h-full object-cover" />
                <div class="absolute top-2 right-2 bg-black/75 backdrop-blur-md px-2.5 py-1 rounded-full text-[10px] font-mono font-bold text-gray-300 border border-gray-700">
                  <i class="fa-solid fa-bolt text-amber-400 mr-1"></i>DROP #42
                </div>
                {screenSticker && (
                  <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <span class="text-7xl animate-bounce">{screenSticker}</span>
                  </div>
                )}
              </div>

              {/* Voting Cards */}
              <div class="space-y-3">
                <button
                  disabled={!votingOpen}
                  onClick={() => handleVote('A')}
                  class={`w-full text-left p-4 rounded-xl border transition relative overflow-hidden ${
                    votedChoice === 'A'
                      ? 'border-emerald-500 bg-emerald-950/40'
                      : votedChoice === 'B'
                      ? 'border-[#232d40] bg-[#141a24] opacity-40'
                      : 'border-[#232d40] bg-[#141a24] active:scale-[0.98]'
                  }`}
                >
                  <p class="text-sm font-semibold text-gray-100 leading-snug">{capA?.text}</p>
                  <div class="mt-2.5 flex justify-between items-center text-xs font-mono text-gray-400">
                    <span class="flex items-center space-x-1">
                      <i class="fa-solid fa-user-ninja text-[11px] text-gray-500"></i>
                      <span>{capA?.author}</span>
                    </span>
                    {votedChoice !== null && <span class="text-emerald-400 font-bold">{percentA}%</span>}
                  </div>
                </button>

                <div class="text-center text-[10px] font-black text-gray-600 tracking-widest">- VS -</div>

                <button
                  disabled={!votingOpen}
                  onClick={() => handleVote('B')}
                  class={`w-full text-left p-4 rounded-xl border transition relative overflow-hidden ${
                    votedChoice === 'B'
                      ? 'border-emerald-500 bg-emerald-950/40'
                      : votedChoice === 'A'
                      ? 'border-[#232d40] bg-[#141a24] opacity-40'
                      : 'border-[#232d40] bg-[#141a24] active:scale-[0.98]'
                  }`}
                >
                  <p class="text-sm font-semibold text-gray-100 leading-snug">{capB?.text}</p>
                  <div class="mt-2.5 flex justify-between items-center text-xs font-mono text-gray-400">
                    <span class="flex items-center space-x-1">
                      <i class="fa-solid fa-user-ninja text-[11px] text-gray-500"></i>
                      <span>{capB?.author}</span>
                    </span>
                    {votedChoice !== null && <span class="text-emerald-400 font-bold">{percentB}%</span>}
                  </div>
                </button>
              </div>

              {votedChoice !== null ? (
                <button onClick={nextPair} class="w-full py-3.5 bg-orange-600 hover:bg-orange-500 font-bold rounded-xl active:scale-95 transition flex items-center justify-center space-x-2">
                  <span>Next Duel</span>
                  <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
              ) : (
                <div class="flex justify-between items-center text-xs text-gray-500 px-2 font-medium">
                  <button onClick={() => alert('Flagged as toxic. Pushed to admin queue.')} class="hover:text-red-400 transition">
                    <i class="fa-regular fa-flag mr-1"></i>Report
                  </button>
                  <button onClick={nextPair} class="hover:text-gray-300 transition">
                    Skip <i class="fa-solid fa-forward-step ml-1"></i>
                  </button>
                </div>
              )}
            </div>
          )}

          {/* TAB 2: COOK / SUBMISSION */}
          {tab === 'cook' && (
            <div class="flex-1 flex flex-col justify-between space-y-4">
              <div>
                <h2 class="text-lg font-black text-gray-100 mb-1 flex items-center space-x-2">
                  <i class="fa-solid fa-kitchen-set text-orange-500"></i>
                  <span>The Kitchen</span>
                </h2>
                <p class="text-xs text-gray-400 mb-4">Write a caption for today's drop. Max 65 characters.</p>

                <div class="w-full h-44 bg-black rounded-xl overflow-hidden mb-4 border border-[#232d40]">
                  <img src={activeImage} class="w-full h-full object-cover" />
                </div>

                {!submissionsOpen ? (
                  <div class="p-4 bg-red-950/30 border border-red-800 rounded-xl text-center text-xs text-red-300">
                    <i class="fa-solid fa-lock text-base mb-1 block"></i>
                    Submissions are locked for this drop cycle.
                  </div>
                ) : (
                  <div>
                    <div class="relative">
                      <textarea
                        value={pendingText}
                        onChange={(e) => setPendingText(e.target.value.slice(0, 65))}
                        placeholder="Cook up something unhinged..."
                        class="w-full bg-[#141a24] border border-[#232d40] rounded-xl p-3 text-sm focus:outline-none focus:border-orange-500 resize-none h-24 text-white"
                      ></textarea>
                      <span class={`absolute bottom-3 right-3 text-xs font-mono ${pendingText.length > 55 ? 'text-red-400' : 'text-gray-500'}`}>
                        {pendingText.length}/65
                      </span>
                    </div>

                    <button
                      onClick={() => setPendingText("POV: You hit snooze at 6:00 and wake up at 8:45")}
                      class="mt-2 text-xs text-orange-400 font-medium flex items-center space-x-1 active:underline"
                    >
                      <i class="fa-solid fa-dice mr-1"></i>
                      <span>Generate random starter</span>
                    </button>
                  </div>
                )}
              </div>

              {submissionsOpen && (
                <button
                  onClick={() => {
                    if (!hasAgreedTerms) {
                      setShowTermsModal(true);
                    } else {
                      submitCaption();
                    }
                  }}
                  disabled={!pendingText.trim()}
                  class="w-full py-3.5 bg-orange-600 disabled:opacity-50 disabled:bg-gray-800 font-bold rounded-xl active:scale-95 transition flex items-center justify-center space-x-2"
                >
                  <i class="fa-solid fa-paper-plane text-xs"></i>
                  <span>Serve to Arena (+10 Heat)</span>
                </button>
              )}
            </div>
          )}

          {/* TAB 3: HALL OF FAME */}
          {tab === 'hall' && (
            <div class="space-y-4">
              <h2 class="text-lg font-black mb-1 flex items-center space-x-2">
                <i class="fa-solid fa-trophy text-amber-400"></i>
                <span>Hall of Cooked</span>
              </h2>
              <div class="p-4 bg-[#141a24] rounded-2xl border border-[#232d40] space-y-3">
                <div class="relative h-52 rounded-xl overflow-hidden border border-gray-800">
                  <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=800" class="w-full h-full object-cover" />
                  <div class="absolute inset-0 bg-black/50 flex items-center justify-center p-4 text-center">
                    <p class="font-black text-lg uppercase tracking-wide text-white font-mono drop-shadow-lg">
                      "WHEN THE EXAM STARTS WITH<br/><span class="text-orange-400">QUESTION 1: CHOOSE A GOD</span>"
                    </p>
                  </div>
                </div>
                <div class="flex justify-between items-center text-xs font-mono">
                  <span class="text-orange-400 font-bold"><i class="fa-solid fa-crown mr-1"></i>@MemeSavant</span>
                  <span class="text-gray-400">92% Win Rate (32k votes)</span>
                </div>
                <button onClick={() => alert('Saved directly to device photo roll!')} class="w-full py-2.5 bg-[#1d2535] hover:bg-[#252f44] text-xs font-bold rounded-xl transition flex items-center justify-center space-x-2">
                  <i class="fa-brands fa-instagram text-pink-400"></i>
                  <span>Share to Instagram Story / TikTok</span>
                </button>
              </div>
            </div>
          )}

          {/* TAB 4: ADVANCED ADMIN COCKPIT */}
          {tab === 'admin' && (
            <div class="space-y-4">
              {!isAdminAuth ? (
                <div class="p-6 bg-[#141a24] rounded-2xl border border-red-900/40 text-center space-y-4">
                  <i class="fa-solid fa-shield-halved text-4xl text-red-500"></i>
                  <h3 class="font-bold text-gray-200">Owner Verification</h3>
                  <input
                    type="password"
                    maxLength={4}
                    placeholder="Enter Master PIN"
                    value={adminPinInput}
                    onChange={(e) => setAdminPinInput(e.target.value)}
                    class="w-36 bg-black border border-gray-700 rounded-lg p-2.5 text-center text-xl font-mono focus:border-red-500 focus:outline-none"
                  />
                  <div>
                    <button
                      onClick={() => {
                        if (adminPinInput === '1337') setIsAdminAuth(true);
                        else alert('Access Denied');
                      }}
                      class="px-6 py-2.5 bg-red-600 font-bold rounded-xl text-xs"
                    >
                      Authenticate
                    </button>
                  </div>
                  <p class="text-[10px] text-gray-500 font-mono">Test PIN: 1337</p>
                </div>
              ) : (
                <div class="space-y-4 text-xs pb-10">
                  <div class="flex justify-between items-center bg-red-950/40 p-3 rounded-xl border border-red-800">
                    <span class="font-black text-red-400 flex items-center space-x-1.5">
                      <i class="fa-solid fa-radiation"></i>
                      <span>MASTER CONTROL CONSOLE</span>
                    </span>
                    <button onClick={() => setIsAdminAuth(false)} class="text-[10px] bg-red-900/60 px-2.5 py-1 rounded font-bold">Lock</button>
                  </div>

                  {/* Chaos Engine */}
                  <div class="bg-[#141a24] p-3.5 rounded-xl border border-red-950 space-y-2.5">
                    <div class="flex justify-between items-center">
                      <h4 class="font-bold text-red-400 uppercase tracking-wider text-[11px]">Chaos & Live Overrides</h4>
                      <button onClick={() => alert('Triggers real-time actions and visual effects.')} class="text-gray-500"><i class="fa-regular fa-circle-question"></i></button>
                    </div>
                    <div class="grid grid-cols-2 gap-2 font-bold">
                      <button onClick={triggerAdminShake} class="p-2 bg-red-950/40 border border-red-900 rounded-lg text-red-300">
                        <i class="fa-solid fa-earth-americas mr-1"></i>Earthquake
                      </button>
                      <button onClick={triggerAdminConfetti} class="p-2 bg-orange-950/40 border border-orange-900 rounded-lg text-orange-300">
                        <i class="fa-solid fa-wand-magic-sparkles mr-1"></i>Confetti
                      </button>
                      <button onClick={() => { setScreenSticker('🤡'); setTimeout(() => setScreenSticker(null), 3000); }} class="p-2 bg-yellow-950/40 border border-yellow-900 rounded-lg text-yellow-300">
                        <i class="fa-solid fa-masks-theater mr-1"></i>Clown Attack
                      </button>
                      <button onClick={() => {
                        const msg = prompt('Enter Red Alert Banner Text:');
                        if (msg !== null) { setAdminBroadcast(msg); updateGlobalConfig({ admin_broadcast: msg }); }
                      }} class="p-2 bg-purple-950/40 border border-purple-900 rounded-lg text-purple-300">
                        <i class="fa-solid fa-bullhorn mr-1"></i>Alert Banner
                      </button>
                    </div>
                  </div>

                  {/* Kill Switches */}
                  <div class="bg-[#141a24] p-3.5 rounded-xl border border-[#232d40] space-y-2.5">
                    <div class="flex justify-between items-center">
                      <h4 class="font-bold text-gray-300 uppercase tracking-wider text-[11px]">Feature Kill Switches</h4>
                      <button onClick={() => alert('Immediately freeze user activity during raids or moderation issues.')} class="text-gray-500"><i class="fa-regular fa-circle-question"></i></button>
                    </div>
                    <div class="flex justify-between items-center">
                      <span>Allow Submissions</span>
                      <input type="checkbox" checked={submissionsOpen} onChange={(e) => { setSubmissionsOpen(e.target.checked); updateGlobalConfig({ submissions_open: e.target.checked }); }} class="w-4 h-4 accent-orange-500" />
                    </div>
                    <div class="flex justify-between items-center">
                      <span>Enable Arena Voting</span>
                      <input type="checkbox" checked={votingOpen} onChange={(e) => { setVotingOpen(e.target.checked); updateGlobalConfig({ voting_open: e.target.checked }); }} class="w-4 h-4 accent-orange-500" />
                    </div>
                    <div class="flex justify-between items-center">
                      <span class="text-red-400 font-bold">Lock Behind Maintenance</span>
                      <input type="checkbox" checked={maintenanceMode} onChange={(e) => { setMaintenanceMode(e.target.checked); updateGlobalConfig({ maintenance_mode: e.target.checked }); }} class="w-4 h-4 accent-red-600" />
                    </div>
                  </div>

                  {/* Active Drop Image Replacer */}
                  <div class="bg-[#141a24] p-3.5 rounded-xl border border-[#232d40] space-y-2">
                    <h4 class="font-bold text-gray-300 uppercase tracking-wider text-[11px]">Change Active Cursed Image</h4>
                    <button
                      onClick={() => {
                        const url = prompt('Enter direct image URL:');
                        if (url) { setActiveImage(url); updateGlobalConfig({ active_image: url }); }
                      }}
                      class="w-full py-2 bg-[#1d2535] hover:bg-[#252f44] font-bold rounded-lg transition"
                    >
                      <i class="fa-regular fa-image mr-1"></i>Replace Active Drop Photo
                    </button>
                  </div>

                  {/* Moderation Queue */}
                  <div class="bg-[#141a24] p-3.5 rounded-xl border border-[#232d40] space-y-2">
                    <h4 class="font-bold text-gray-300 uppercase tracking-wider text-[11px]">Purge Toxic Captions</h4>
                    {captions.slice(0, 5).map(c => (
                      <div key={c.id} class="p-2 bg-black/40 rounded flex justify-between items-center font-mono">
                        <span class="truncate w-48 text-gray-300">{c.text}</span>
                        <button
                          onClick={async () => {
                            if (isSupabaseConfigured) await supabase.from('captions').delete().eq('id', c.id);
                            setCaptions(captions.filter(x => x.id !== c.id));
                          }}
                          class="bg-red-800 text-white px-2 py-0.5 rounded font-bold hover:bg-red-700"
                        >
                          <i class="fa-solid fa-trash mr-1"></i>Delete
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
        </main>
      )}

      {/* Navigation Bar */}
      <nav class="h-16 bg-[#141a24] border-t border-[#1c2433] flex items-center justify-around fixed bottom-0 left-0 right-0 max-w-md mx-auto z-10">
        <button onClick={() => setTab('duel')} class={`flex flex-col items-center ${tab === 'duel' ? 'text-orange-500' : 'text-gray-400'}`}>
          <i class="fa-solid fa-fire text-lg"></i>
          <span class="text-[10px] font-bold mt-1">Duel</span>
        </button>
        <button onClick={() => setTab('cook')} class={`flex flex-col items-center ${tab === 'cook' ? 'text-orange-500' : 'text-gray-400'}`}>
          <i class="fa-solid fa-utensils text-lg"></i>
          <span class="text-[10px] font-bold mt-1">Cook</span>
        </button>
        <button onClick={() => setTab('hall')} class={`flex flex-col items-center ${tab === 'hall' ? 'text-orange-500' : 'text-gray-400'}`}>
          <i class="fa-solid fa-trophy text-lg"></i>
          <span class="text-[10px] font-bold mt-1">Hall</span>
        </button>
      </nav>

      {/* Glide-in Cooking Pad Onboarding Tutorial */}
      {showTutorial && (
        <div class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-6">
          <div class="bg-[#171f2c] border border-orange-500/50 w-full max-w-sm rounded-3xl p-6 shadow-2xl flex flex-col items-center text-center space-y-4">
            <div class="w-16 h-16 bg-orange-950/60 border border-orange-500/30 rounded-2xl flex items-center justify-center text-2xl text-orange-400">
              {tutorialStep === 0 && <i class="fa-solid fa-fire-burner"></i>}
              {tutorialStep === 1 && <i class="fa-solid fa-hand-fist"></i>}
              {tutorialStep === 2 && <i class="fa-solid fa-crown"></i>}
            </div>

            <h3 class="text-lg font-black text-white">
              {tutorialStep === 0 && "Welcome to the Kitchen!"}
              {tutorialStep === 1 && "The 1v1 Arena"}
              {tutorialStep === 2 && "Earn Heat & Go Viral"}
            </h3>

            <p class="text-xs text-gray-300 leading-relaxed min-h-[50px]">
              {tutorialStep === 0 && "Every 12 hours, the internet drops ONE cursed image. Submit your best caption or vote for the funniest one."}
              {tutorialStep === 1 && "Captions face off blind in head-to-head duels. Tap the caption that makes you laugh hardest."}
              {tutorialStep === 2 && "Every vote builds your Heat streak. Win the drop and your meme is permanently crowned in the Hall of Cooked."}
            </p>

            <div class="flex space-x-1.5 pt-2">
              {[0, 1, 2].map((i) => (
                <div key={i} class={`h-1.5 rounded-full transition-all ${i === tutorialStep ? 'w-6 bg-orange-500' : 'w-2 bg-gray-700'}`}></div>
              ))}
            </div>

            <div class="w-full pt-2">
              {tutorialStep < 2 ? (
                <button onClick={() => setTutorialStep(s => s + 1)} class="w-full py-3 bg-orange-600 font-bold rounded-xl text-xs active:scale-95 transition">
                  Next Slide →
                </button>
              ) : (
                <button onClick={() => setShowTutorial(false)} class="w-full py-3 bg-emerald-600 font-bold rounded-xl text-xs active:scale-95 transition">
                  Let's Cook! 🔥
                </button>
              )}
            </div>
          </div>
        </div>
      )}

      {/* Mandatory Legal & UGC Agreement */}
      {showTermsModal && (
        <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4">
          <div class="bg-[#141a24] border border-[#232d40] w-full max-w-sm rounded-2xl p-5 space-y-4 max-h-[85vh] overflow-y-auto">
            <h3 class="font-black text-sm text-orange-500 flex items-center space-x-2">
              <i class="fa-solid fa-file-contract"></i>
              <span>Community Guidelines & Terms</span>
            </h3>
            <div class="text-[11px] text-gray-300 space-y-2 bg-black/40 p-3 rounded-lg border border-gray-800 font-mono leading-relaxed">
              <p><strong>1. Zero Tolerance:</strong> No harassment, hate speech, slurs, or NSFW content. Violators receive permanent IP exclusions.</p>
              <p><strong>2. UGC Rights:</strong> By submitting, you grant COOKED a worldwide, royalty-free license to display your text on public feeds.</p>
              <p><strong>3. Age Requirement:</strong> You verify that you are at least 13 years old.</p>
            </div>
            <div class="flex items-center space-x-2">
              <input type="checkbox" id="legalCheck" class="w-4 h-4 accent-orange-500" />
              <label for="legalCheck" class="text-xs text-gray-300">I agree to the Community Terms</label>
            </div>
            <div class="flex space-x-2 pt-2">
              <button onClick={() => setShowTermsModal(false)} class="flex-1 py-2.5 bg-gray-800 rounded-xl text-xs font-bold text-gray-400">Cancel</button>
              <button
                onClick={() => {
                  const check = document.getElementById('legalCheck');
                  if (!check || !check.checked) return alert('You must check the agreement box.');
                  setHasAgreedTerms(true);
                  localStorage.setItem('agreed_terms', 'true');
                  setShowTermsModal(false);
                  submitCaption();
                }}
                class="flex-1 py-2.5 bg-orange-600 rounded-xl text-xs font-bold text-white active:scale-95 transition"
              >
                Accept & Post
              </button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

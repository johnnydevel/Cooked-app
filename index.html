// ==========================================
// 2. PROFANITY & AUTO-MODERATION ENGINE
// ==========================================
class ContentFilterEngine {
  constructor() {
    this.slurs = ["nigger", "nigga", "faggot", "retard", "kike", "chink", "pedophile", "kys", "kill yourself"];
    this.vulgar = ["fuck", "shit", "bitch", "cunt", "whore", "slut", "dick", "pussy", "asshole"];
    this.leetspeak = { '@':'a', '4':'a', '$':'s', '5':'s', '0':'o', '1':'i', '!':'i', '3':'e', '7':'t' };
  }

  normalize(str) {
    let clean = str.toLowerCase();
    for (const [k, v] of Object.entries(this.leetspeak)) clean = clean.split(k).join(v);
    return clean.replace(/[^a-z0-9]/g, "");
  }

  evaluate(text) {
    const raw = text.toLowerCase();
    const clean = this.normalize(text);

    for (const s of this.slurs) {
      if (raw.includes(s) || clean.includes(s)) {
        return { safe: false, reason: "Severe slurs or hate speech prohibited.", level: "REJECT" };
      }
    }
    if (/https?:\/\/|\.gg\/|\.com/i.test(text)) {
      return { safe: false, reason: "External links are strictly prohibited.", level: "REJECT" };
    }
    for (const v of this.vulgar) {
      if (raw.includes(v) || clean.includes(v)) {
        return { safe: false, reason: "Excessive Vulgarity", level: "FLAG" };
      }
    }
    return { safe: true, reason: "Approved", level: "CLEAN" };
  }
}

const filterEngine = new ContentFilterEngine();

// ==========================================
// 3. MAIN REACT APPLICATION

function CookedApp() {
  const [tab, setTab] = useState('duel'); // duel | cook | hall | profile | admin
  const [flameTaps, setFlameTaps] = useState(0);

  // App Master Configurations
  const [adminPin, setAdminPin] = useState('1337');
  const [submissionsOpen, setSubmissionsOpen] = useState(true);
  const [votingOpen, setVotingOpen] = useState(true);
  const [maintenanceMode, setMaintenanceMode] = useState(false);
  const [adminBroadcast, setAdminBroadcast] = useState('');
  const [activeImage, setActiveImage] = useState('https://images.unsplash.com/photo-1543852786-1cf6624b9987?w=800');

  const [isAdminAuth, setIsAdminAuth] = useState(false);
  const [newPinInput, setNewPinInput] = useState('');
  const [pinNotice, setPinNotice] = useState(false);

  // Chaos States
  const [isEarthquake, setIsEarthquake] = useState(false);
  const [screenSticker, setScreenSticker] = useState(null);

  // User Profile State (Strict @ prefix & unique handle)
  const [usernameInput, setUsernameInput] = useState(() => localStorage.getItem('cooked_username') || `@Chef_${Math.floor(1000 + Math.random() * 9000)}`);
  const [userProfile, setUserProfile] = useState(() => ({
    avatar: localStorage.getItem('cooked_avatar') || 'fa-hat-chef',
    title: localStorage.getItem('cooked_title') || 'Line Cook',
    spices: parseInt(localStorage.getItem('cooked_spices') || '25', 10),
    lastVotedTimestamp: parseInt(localStorage.getItem('cooked_last_voted') || '0', 10)
  }));
  const [usernameStatus, setUsernameStatus] = useState({ state: 'idle', msg: '' });

  // Notifications / Inbox State
  const [notifications, setNotifications] = useState([]);
  const [showInbox, setShowInbox] = useState(false);
  const [inboxTargetUser, setInboxTargetUser] = useState('');
  const [inboxTitle, setInboxTitle] = useState('');
  const [inboxMessage, setInboxMessage] = useState('');

  // Drop Submissions (Users uploading memes for the duel)
  const [uploadImageUrl, setUploadImageUrl] = useState('');
  const [uploadSuggestedCaption, setUploadSuggestedCaption] = useState('');
  const [pendingDropSubmissions, setPendingDropSubmissions] = useState([]);

  // Voting Loop & Duels
  const [captions, setCaptions] = useState([]);
  const [activePair, setActivePair] = useState([0, 1]);
  const [votedChoice, setVotedChoice] = useState(null);

  // Scheduled Drops & Hall
  const [scheduledDrops, setScheduledDrops] = useState([]);
  const [calDate, setCalDate] = useState(new Date().toISOString().split('T')[0]);
  const [calTitle, setCalTitle] = useState('');
  const [calUrl, setCalUrl] = useState('');

  // Automated Server-Stitched Meme Canvas Ref
  const hallCanvasRef = useRef(null);
  const [hallStitchedImage, setHallStitchedImage] = useState(null);

  useEffect(() => {
    loadAppData();

  // Initial Sync from Supabase
  const loadAppData = async () => {
    if (!isSupabaseLive) {
      setCaptions([
        { id: '1', author: '@SnoopChef', text: 'Me checking the fridge for the 4th time hoping new snacks spawned', wins: 84, losses: 16, flagged: false },
        { id: '2', author: '@ToastGod', text: 'My last brain cell calculating 7 + 8 on fingers during the exam', wins: 62, losses: 38, flagged: false },
        { id: '3', author: '@CatOverlord', text: 'Walking past the microwave with 00:01 left like a SWAT defuser', wins: 41, losses: 29, flagged: false },
        { id: '4', author: '@SpamKing', text: 'FREE DISCORD ROBUX AIRDROP CLICK PROFILE', wins: 1, losses: 99, flagged: true, flag_reason: 'External link' }
      ]);
      setPendingDropSubmissions([
        { id: 'sub1', author: '@HamsterFan', image_url: 'https://images.unsplash.com/photo-1548767797-d8c844163c4c?w=800', suggested_caption: 'Staring into soul', status: 'pending' }
      ]);
      setScheduledDrops([
        { id: 'd1', target_date: '2026-09-29', title: 'Raccoon Trash Heist', image_url: 'https://images.unsplash.com/photo-1517849845537-4d257902454a?w=800' }
      ]);
      generateServerMemeHeader("WHEN THE EXAM STARTS WITH QUESTION 1: CHOOSE A GOD", "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=800", "@MemeSavant");
      return;
    }

    try {
      const { data: config } = await supabase.from('app_config').select('*').eq('id', 1).single();
      if (config) {
        setAdminPin(config.admin_pin || '1337');
        setSubmissionsOpen(config.submissions_open);
        setVotingOpen(config.voting_open);
        setMaintenanceMode(config.maintenance_mode);
        setAdminBroadcast(config.admin_broadcast || '');
        if (config.active_image) setActiveImage(config.active_image);
      }

      const { data: caps } = await supabase.from('captions').select('*').order('created_at', { ascending: false });
      if (caps && caps.length >= 2) setCaptions(caps);

      const { data: subs } = await supabase.from('drop_submissions').select('*').eq('status', 'pending');
      if (subs) setPendingDropSubmissions(subs);

      const { data: drops } = await supabase.from('scheduled_calendar_drops').select('*').order('target_date', { ascending: true });
      if (drops) setScheduledDrops(drops);

      generateServerMemeHeader("WHEN THE EXAM STARTS WITH QUESTION 1: CHOOSE A GOD", activeImage, "@MemeSavant");
    } catch (e) {
      console.error('Data sync failed:', e);

  // Load User Inbox
  const loadNotifications = async () => {

      setNotifications([
        { id: 'n1', title: 'Welcome to COOKED!', message: 'Vote every 12 hours to claim +5 free Spices.', is_read: false, created_at: new Date().toISOString() }

    const { data } = await supabase.from('user_notifications')
      .select('*')
      .eq('target_username', usernameInput.toLowerCase())
      .order('created_at', { ascending: false });
    if (data) setNotifications(data);
  };

  // Automated Server-Style Canvas Stitcher (White Header Box over Image)
  const generateServerMemeHeader = (text, imgUrl, author) => {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = imgUrl;

    img.onload = () => {
      const width = 800;
      const height = 800;
      const headerHeight = 180;
      canvas.width = width;
      canvas.height = height + headerHeight;

      // Solid White Top Header
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, headerHeight);

      // Black Impact/Inter Top Text
      ctx.fillStyle = "#000000";
      ctx.font = "bold 32px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const words = text.toUpperCase().split(' ');
      let line = '';
      const lines = [];
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        if (ctx.measureText(testLine).width > width - 80 && n > 0) {
          lines.push(line);
          line = words[n] + ' ';
        } else {
          line = testLine;
        }
      }
      lines.push(line);

      const startY = (headerHeight / 2) - ((lines.length - 1) * 20) - 8;
      lines.forEach((l, idx) => {
        ctx.fillText(l.trim(), width / 2, startY + (idx * 40));
      });

      // Watermark
      ctx.font = "bold 16px monospace";
      ctx.fillStyle = "#ea580c";
      ctx.fillText(`COOKED.APP • CROWNED MEME BY ${author}`, width / 2, headerHeight - 20);

      // Draw Main Image Below
      ctx.drawImage(img, 0, headerHeight, width, height);

      setHallStitchedImage(canvas.toDataURL('image/png'));
    };
  };

  // Unique Username Auto-Save & Debounce Engine
  const handleUsernameChange = (rawInput) => {
    // Force lowercase, remove whitespace, and keep non-deletable @
    let clean = rawInput.trim().toLowerCase();
    if (!clean.startsWith('@')) {
      clean = '@' + clean.replace(/@/g, '');
    }
    setUsernameInput(clean);
    setUsernameStatus({ state: 'checking', msg: 'Verifying uniqueness...' });
  };

  useEffect(() => {
    const timer = setTimeout(async () => {
      if (usernameInput.length < 3) {
        setUsernameStatus({ state: 'error', msg: 'Handle too short (min 3 chars)' });
        return;
      }

      if (isSupabaseLive) {
        const { data } = await supabase.from('user_profiles').select('username').eq('username', usernameInput);
        if (data && data.length > 0 && usernameInput !== localStorage.getItem('cooked_username')) {
          setUsernameStatus({ state: 'error', msg: 'Handle is already taken! Pick another.' });
          return;
        }

        // Auto-save upsert
        await supabase.from('user_profiles').upsert({
          username: usernameInput,
          avatar: userProfile.avatar,
          title: userProfile.title,
          spices: userProfile.spices
        }, { onConflict: 'username' });
      }

      localStorage.setItem('cooked_username', usernameInput);
      setUsernameStatus({ state: 'saved', msg: 'Handle auto-saved & verified unique!' });
    }, 600);

    return () => clearTimeout(timer);
  }, [usernameInput, userProfile.avatar, userProfile.title]);

  // 12-Hour Spices Reward Logic
  const handleVote = async (choice) => {
    if (!votingOpen || votedChoice !== null || captions.length < 2) return;
    setVotedChoice(choice);

    const now = Date.now();
    const twelveHoursMs = 12 * 60 * 60 * 1000;
    let earnedSpices = false;

    if (now - userProfile.lastVotedTimestamp > twelveHoursMs) {
      const updatedSpices = userProfile.spices + 5;
      setUserProfile(p => ({ ...p, spices: updatedSpices, lastVotedTimestamp: now }));
      localStorage.setItem('cooked_spices', updatedSpices.toString());
      localStorage.setItem('cooked_last_voted', now.toString());
      earnedSpices = true;

      // Add Inbox notification
      const notif = {
        target_username: usernameInput.toLowerCase(),
        title: '🔥 +5 Spices Claimed!',
        message: 'You completed your 12-hour Arena vote duty. Keep climbing the ranks!'
      };
      if (isSupabaseLive) await supabase.from('user_notifications').insert([notif]);
      setNotifications(prev => [notif, ...prev]);
    }

    const winIdx = choice === 'A' ? activePair[0] : activePair[1];
    const loseIdx = choice === 'A' ? activePair[1] : activePair[0];
    const win = captions[winIdx];
    const lose = captions[loseIdx];

    if (isSupabaseLive) {
      if (win) await supabase.from('captions').update({ wins: (win.wins || 0) + 1 }).eq('id', win.id);
      if (lose) await supabase.from('captions').update({ losses: (lose.losses || 0) + 1 }).eq('id', lose.id);
    }

    if (earnedSpices && window.confetti) {
      window.confetti({ particleCount: 120, spread: 70, origin: { y: 0.7 } });
    }

  const nextDuel = () => {
    setVotedChoice(null);
    if (captions.length >= 2) {
      const a = Math.floor(Math.random() * captions.length);
      let b = Math.floor(Math.random() * captions.length);
      while (b === a) b = Math.floor(Math.random() * captions.length);
      setActivePair([a, b]);

  };

  // Submit User Image for Duel Approval
  const handleSubmitImageForDuel = async () => {
    if (!uploadImageUrl.trim()) return alert('Paste a valid direct image URL.');
    const evalRes = filterEngine.evaluate(uploadSuggestedCaption);
    if (evalRes.level === "REJECT") return alert(`Rejected: ${evalRes.reason}`);

    const item = {
      author: usernameInput,
      image_url: uploadImageUrl.trim(),
      suggested_caption: uploadSuggestedCaption.trim(),
      status: 'pending'
    };

    if (isSupabaseLive) {
      await supabase.from('drop_submissions').insert([item]);
    } else {
      setPendingDropSubmissions([...pendingDropSubmissions, { ...item, id: Date.now().toString() }]);
    }

    setUploadImageUrl('');
    setUploadSuggestedCaption('');
    alert('🚀 Image submitted to Admin for duel verification!');
  };

  // Admin Approval: Approves image, sets as active drop, & notifies user
  const handleAdminApproveSubmission = async (sub) => {
    setActiveImage(sub.image_url);

    // Send direct inbox message to submitting user
    const notif = {
      target_username: sub.author.toLowerCase(),
      title: '🎉 Your Drop Was Approved!',
      message: `Your submitted image has been crowned as the LIVE Arena Drop by Admin! You earned +25 Spices.`
    };

    if (isSupabaseLive) {
      await supabase.from('drop_submissions').update({ status: 'approved' }).eq('id', sub.id);
      await supabase.from('app_config').update({ active_image: sub.image_url }).eq('id', 1);
      await supabase.from('user_notifications').insert([notif]);
    }

    setPendingDropSubmissions(pendingDropSubmissions.filter(x => x.id !== sub.id));
    alert(`Approved! Notification delivered to ${sub.author}'s inbox.`);
  };

  // Admin Custom Inbox Dispatcher
  const handleSendCustomNotification = async () => {
    if (!inboxTargetUser.trim() || !inboxTitle.trim() || !inboxMessage.trim()) {
      return alert('Fill out user, title, and message.');
    }

    const payload = {
      target_username: inboxTargetUser.trim().toLowerCase(),
      title: inboxTitle.trim(),
      message: inboxMessage.trim()
    };

    if (isSupabaseLive) {
      await supabase.from('user_notifications').insert([payload]);
    }
    if (inboxTargetUser.toLowerCase() === usernameInput.toLowerCase()) {
      setNotifications([payload, ...notifications]);
    }

    setInboxTitle('');
    setInboxMessage('');
    alert(`Message delivered to ${inboxTargetUser}'s inbox!`);
  };

  const capA = captions[activePair[0]] || captions[0];
  const capB = captions[activePair[1]] || captions[1];
  const totA = (capA?.wins || 0) + (capA?.losses || 0);
  const totB = (capB?.wins || 0) + (capB?.losses || 0);
  const pctA = totA + totB === 0 ? 50 : Math.round((totA / (totA + totB)) * 100);
  const pctB = 100 - pctA;

  return (
    <div class={`flex-1 flex flex-col justify-between ${isEarthquake ? 'shake-active' : ''}`}>

      {/* Top Banner Alert */}
      {adminBroadcast && (
        <div class="bg-red-600 px-4 py-2 text-xs font-black tracking-wide text-white flex justify-between items-center shadow-lg sticky top-0 z-30">

      {/* Header Bar */}
      <header class="p-4 flex items-center justify-between border-b border-slate-200 dark:border-[#1c2433] bg-white/90 dark:bg-[#111622]/90 backdrop-blur-md sticky top-0 z-20">
        <div class="flex items-center space-x-2">
          <button
            onClick={() => {
              const next = flameTaps + 1;
              if (next >= 3) { setFlameTaps(0); setTab('admin'); }
              else { setFlameTaps(next); setTimeout(() => setFlameTaps(0), 1200); }
            }}
            class="text-xl font-black text-orange-600 dark:text-orange-500 tracking-wider flex items-center space-x-1 active:scale-95 transition"
          >
            <i class="fa-solid fa-fire-flame-curved"></i>
            <span>COOKED</span>
          </button>
          <span class="text-[9px] bg-slate-200 dark:bg-[#1d2535] text-slate-600 dark:text-gray-400 font-mono px-2 py-0.5 rounded font-bold uppercase">
            {isSupabaseLive ? 'LIVE' : 'PREVIEW'}
          </span>
        </div>

        <div class="flex items-center space-x-2">
          {/* Notifications Inbox Trigger */}
          <button
            onClick={() => setShowInbox(true)}
            class="relative w-8 h-8 rounded-full bg-slate-100 dark:bg-[#171f2e] border border-slate-300 dark:border-[#232e42] flex items-center justify-center text-slate-700 dark:text-gray-300 text-xs active:scale-95"
          >
            <i class="fa-solid fa-bell"></i>
            {notifications.length > 0 && (
              <span class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full border-2 border-white dark:border-black"></span>
            )}
          </button>

          {/* User Spices Counter */}
          <div class="flex items-center space-x-1.5 text-orange-600 dark:text-orange-400 font-bold bg-orange-50 dark:bg-[#171f2e] border border-orange-200 dark:border-orange-500/20 px-2.5 py-1 rounded-full text-xs font-mono">
            <i class="fa-solid fa-pepper-hot text-xs"></i>
            <span>{userProfile.spices}</span>
          </div>
        </div>
      </header>

      {/* Main Views */}
      {maintenanceMode && tab !== 'admin' ? (
        <div class="flex-1 flex flex-col items-center justify-center p-6 text-center">
          <i class="fa-solid fa-screwdriver-wrench text-5xl text-orange-500 mb-4 animate-bounce"></i>
          <h2 class="text-xl font-black mb-2">Emergency Maintenance</h2>
          <p class="text-xs text-gray-500 max-w-xs">The chef is cleaning the kitchen floor. Battles resume shortly.</p>
        </div>
      ) : (
        <main class="flex-1 flex flex-col p-4 overflow-y-auto">

          {/* TAB 1: ARENA DUEL SCREEN */}
          {tab === 'duel' && (
            <div class="flex-1 flex flex-col justify-between space-y-4">
              <div class="relative w-full h-64 bg-black rounded-2xl overflow-hidden border border-slate-200 dark:border-[#1e2638] shadow-2xl">
                <img src={activeImage} class="w-full h-full object-cover" />
                <div class="absolute top-2.5 right-2.5 bg-black/75 backdrop-blur-md px-2.5 py-1 rounded-full text-[10px] font-mono font-bold text-gray-300 border border-gray-700">
                  <i class="fa-solid fa-bolt text-amber-400 mr-1"></i>DROP #42
                </div>
                {screenSticker && (
                  <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <span class="text-7xl animate-bounce">{screenSticker}</span>
                  </div>
                )}
              </div>

              {/* Matchup Duel Cards */}
              <div class="space-y-3">
                <button
                  disabled={!votingOpen}
                  onClick={() => handleVote('A')}
                  class={`w-full text-left p-4 rounded-xl border transition relative overflow-hidden ${
                    votedChoice === 'A'
                      ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 shadow-lg'
                      : votedChoice === 'B'
                      ? 'opacity-40 border-slate-200 dark:border-[#1e2638] bg-slate-50 dark:bg-[#111622]'
                      : 'border-slate-200 dark:border-[#1e2638] bg-slate-50 dark:bg-[#111622] active:scale-[0.98]'
                  }`}
                >
                  <p class="text-sm font-semibold leading-snug">{capA?.text}</p>
                  <div class="mt-2.5 flex justify-between items-center text-xs font-mono text-gray-500">
                    <span class="flex items-center space-x-1">
                      <i class="fa-solid fa-user-ninja text-[11px]"></i>
                      <span>{capA?.author}</span>
                    </span>
                    {votedChoice !== null && <span class="text-emerald-500 font-bold">{pctA}%</span>}
                  </div>
                </button>

                <div class="text-center text-[10px] font-black text-gray-400 tracking-widest">- VS -</div>

                <button
                  disabled={!votingOpen}
                  onClick={() => handleVote('B')}
                  class={`w-full text-left p-4 rounded-xl border transition relative overflow-hidden ${
                    votedChoice === 'B'
                      ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 shadow-lg'
                      : votedChoice === 'A'
                      ? 'opacity-40 border-slate-200 dark:border-[#1e2638] bg-slate-50 dark:bg-[#111622]'
                      : 'border-slate-200 dark:border-[#1e2638] bg-slate-50 dark:bg-[#111622] active:scale-[0.98]'
                  }`}
                >
                  <p class="text-sm font-semibold leading-snug">{capB?.text}</p>
                  <div class="mt-2.5 flex justify-between items-center text-xs font-mono text-gray-500">
                    <span class="flex items-center space-x-1">
                      <i class="fa-solid fa-user-ninja text-[11px]"></i>
                      <span>{capB?.author}</span>
                    </span>
                    {votedChoice !== null && <span class="text-emerald-500 font-bold">{pctB}%</span>}
                  </div>
                </button>
              </div>

              {votedChoice !== null ? (
                <button
                  onClick={nextDuel}
                  class="w-full py-3.5 bg-orange-600 hover:bg-orange-500 font-bold rounded-xl active:scale-95 transition flex items-center justify-center space-x-2 text-sm text-white shadow-lg"
                >
                  <span>Next Duel</span>
                  <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
              ) : (
                <div class="flex justify-between items-center text-xs text-gray-500 px-2 font-medium">
                  <span>Vote once every 12h for +5 Spices</span>
                  <button onClick={nextDuel} class="hover:text-orange-500 transition">
                    Skip <i class="fa-solid fa-forward-step ml-1"></i>
                  </button>
                </div>
              )}
            </div>
          )}

          {/* TAB 2: COOK / SUBMISSION (UPLOAD IMAGE FOR DUEL) */}
          {tab === 'cook' && (
            <div class="flex-1 flex flex-col justify-between space-y-4">
              <div>
                <h2 class="text-lg font-black mb-1 flex items-center space-x-2">
                  <i class="fa-solid fa-cloud-arrow-up text-orange-500"></i>
                  <span>Submit Meme for Duel</span>
                </h2>
                <p class="text-xs text-gray-500 mb-4">Paste your image link. Approved entries go live as official drops and earn you +25 Spices.</p>

                <div class="space-y-3">
                  <div>
                    <label class="text-xs font-bold text-gray-500 block mb-1">Direct Image URL</label>
                    <input
                      type="text"
                      placeholder="https://i.imgur.com/... or unsplash link"
                      value={uploadImageUrl}
                      onChange={(e) => setUploadImageUrl(e.target.value)}
                      class="w-full bg-slate-50 dark:bg-[#111622] border border-slate-300 dark:border-[#1e2638] rounded-xl p-3 text-xs font-mono focus:outline-none focus:border-orange-500"
                    />
                  </div>

                  <div>
                    <label class="text-xs font-bold text-gray-500 block mb-1">Suggested Caption (Optional)</label>
                    <textarea
                      placeholder="Give it a starting caption..."
                      value={uploadSuggestedCaption}
                      onChange={(e) => setUploadSuggestedCaption(e.target.value.slice(0, 65))}
                      class="w-full bg-slate-50 dark:bg-[#111622] border border-slate-300 dark:border-[#1e2638] rounded-xl p-3 text-xs resize-none h-20 focus:outline-none focus:border-orange-500"
                    ></textarea>
                  </div>

                  {uploadImageUrl && (
                    <div class="h-40 rounded-xl overflow-hidden border border-slate-300 dark:border-gray-800 bg-black">
                      <img src={uploadImageUrl} class="w-full h-full object-cover" />
                    </div>
                  )}
                </div>
              </div>

              <button
                onClick={handleSubmitImageForDuel}
                class="w-full py-3.5 bg-orange-600 hover:bg-orange-500 font-bold rounded-xl active:scale-95 transition text-white text-xs shadow-lg flex items-center justify-center space-x-2"
              >
                <i class="fa-solid fa-paper-plane"></i>
                <span>Send to Admin for Approval</span>
              </button>
            </div>
          )}

          {/* TAB 3: HALL OF FAME (SERVER-STITCHED MEME) */}
          {tab === 'hall' && (
            <div class="space-y-4">
              <h2 class="text-lg font-black mb-1 flex items-center space-x-2">
                <i class="fa-solid fa-trophy text-amber-500"></i>
                <span>Hall of Cooked</span>
              </h2>

              <div class="p-4 bg-slate-50 dark:bg-[#111622] rounded-2xl border border-slate-200 dark:border-[#1e2638] space-y-3 shadow-xl">
                {/* Live Stitched Output Display */}
                {hallStitchedImage && (
                  <div class="rounded-xl overflow-hidden shadow-md border border-slate-300 dark:border-gray-800">
                    <img src={hallStitchedImage} class="w-full h-auto block" />
                  </div>
                )}

                <div class="flex justify-between items-center text-xs font-mono pt-1">
                  <span class="text-orange-600 dark:text-orange-400 font-bold flex items-center space-x-1">
                    <i class="fa-solid fa-crown text-amber-400"></i>
                    <span>@MemeSavant</span>
                  </span>
                  <span class="text-gray-400">92% Win Rate</span>
                </div>

                {/* Share Meme Button */}
                <button
                  onClick={() => {
                    if (navigator.share && hallStitchedImage) {
                      fetch(hallStitchedImage)
                        .then(res => res.blob())
                        .then(blob => {
                          const file = new File([blob], 'cooked-meme.png', { type: 'image/png' });
                          navigator.share({ title: 'Crowned on COOKED', files: [file] });
                        })
                        .catch(() => alert('Saved image to clipboard!'));
                    } else {
                      const link = document.createElement('a');
                      link.download = `crowned-meme.png`;
                      link.href = hallStitchedImage;
                      link.click();
                    }
                  }}
                  class="w-full py-2.5 bg-orange-600 hover:bg-orange-500 text-xs font-bold rounded-xl transition flex items-center justify-center space-x-2 text-white shadow-md"
                >
                  <i class="fa-solid fa-share-nodes"></i>
                  <span>Share Meme</span>
                </button>
              </div>
            </div>
          )}

          {/* TAB 4: PROFILE SETTINGS (AUTO-SAVING & UNIQUE @) */}
          {tab === 'profile' && (
            <div class="space-y-4">
              <h2 class="text-lg font-black mb-1 flex items-center space-x-2">
                <i class="fa-solid fa-user-gear text-orange-500"></i>
                <span>Profile Settings</span>
              </h2>

              <div class="p-4 bg-slate-50 dark:bg-[#111622] rounded-2xl border border-slate-200 dark:border-[#1e2638] space-y-4 shadow-xl">
                {/* User Card */}
                <div class="flex items-center space-x-3">
                  <div class="w-14 h-14 bg-orange-100 dark:bg-orange-950/40 border border-orange-500/40 rounded-2xl flex items-center justify-center text-2xl text-orange-500">
                    <i class={`fa-solid ${userProfile.avatar}`}></i>
                  </div>
                  <div>
                    <h3 class="font-black text-base">{usernameInput}</h3>
                    <p class="text-xs text-orange-500 font-mono font-bold">{userProfile.title}</p>
                    <span class="text-[10px] text-gray-400 font-mono">Spices: {userProfile.spices}</span>
                  </div>
                </div>

                <hr class="border-slate-200 dark:border-gray-800" />

                {/* Handle Input with non-deletable @ & uniqueness auto-check */}
                <div class="space-y-1.5">
                  <label class="text-xs text-gray-500 font-medium">Handle (Unique)</label>
                  <input
                    type="text"
                    maxLength={16}
                    value={usernameInput}
                    onChange={(e) => handleUsernameChange(e.target.value)}
                    class="w-full bg-white dark:bg-black border border-slate-300 dark:border-gray-700 rounded-lg p-2.5 text-xs font-mono focus:outline-none focus:border-orange-500"
                  />
                  <p class={`text-[10px] font-mono ${
                    usernameStatus.state === 'error' ? 'text-red-500' :
                    usernameStatus.state === 'saved' ? 'text-emerald-500' : 'text-gray-400'
                  }`}>
                    {usernameStatus.msg}
                  </p>
                </div>

                {/* Pick Avatar Icon */}
                <div class="space-y-1.5">
                  <label class="text-xs text-gray-500 font-medium">Avatar</label>
                  <div class="grid grid-cols-5 gap-2">
                    {['fa-hat-chef', 'fa-fire', 'fa-skull', 'fa-cat', 'fa-crown'].map(icon => (
                      <button
                        key={icon}
                        onClick={() => {
                          setUserProfile(p => ({ ...p, avatar: icon }));
                          localStorage.setItem('cooked_avatar', icon);
                        }}
                        class={`h-10 rounded-lg border flex items-center justify-center text-sm transition ${
                          userProfile.avatar === icon
                            ? 'border-orange-500 bg-orange-50 dark:bg-orange-950/40 text-orange-500'
                            : 'border-slate-200 dark:border-gray-800 text-gray-400'
                        }`}
                      >
                        <i class={`fa-solid ${icon}`}></i>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Title Selection */}
                <div class="space-y-1.5">
                  <label class="text-xs text-gray-500 font-medium">Chef Title</label>
                  <select
                    value={userProfile.title}
                    onChange={(e) => {
                      const t = e.target.value;
                      setUserProfile(p => ({ ...p, title: t }));
                      localStorage.setItem('cooked_title', t);
                    }}
                    class="w-full bg-white dark:bg-black border border-slate-300 dark:border-gray-700 rounded-lg p-2 text-xs font-mono focus:outline-none focus:border-orange-500"
                  >
                    <option value="Line Cook">Line Cook (0 Spices)</option>
                    <option value="Sous Chef">Sous Chef (50 Spices)</option>
                    <option value="Head Chef">Head Chef (200 Spices)</option>
                    <option value="Michelin Menace">Michelin Menace (1,000 Spices)</option>
                  </select>
                </div>
              </div>
            </div>
          )}

          {/* TAB 5: MASTER ADMIN COCKPIT */}
          {tab === 'admin' && (
            <div class="space-y-4">
              {!isAdminAuth ? (
                <div class="p-6 bg-slate-50 dark:bg-[#111622] rounded-2xl border border-red-500/40 text-center space-y-4 shadow-2xl">
                  <i class="fa-solid fa-shield-halved text-4xl text-red-500 animate-pulse"></i>
                  <h3 class="font-bold">Owner Authentication</h3>
                  <input
                    type="password"
                    maxLength={4}
                    placeholder="Master PIN"
                    value={enteredPin}
                    onChange={(e) => setEnteredPin(e.target.value)}
                    class="w-36 bg-white dark:bg-black border border-gray-700 rounded-lg p-2.5 text-center text-xl font-mono focus:border-red-500 focus:outline-none"
                  />
                  <div>
                    <button
                      onClick={() => {
                        if (enteredPin === adminPin) { setIsAdminAuth(true); setEnteredPin(''); }
                        else alert('Access Denied');
                      }}
                      class="px-6 py-2.5 bg-red-600 font-bold rounded-xl text-xs text-white"
                    >
                      Authenticate
                    </button>
                  </div>
                  <p class="text-[10px] text-gray-400 font-mono">Current PIN: {adminPin}</p>
                </div>
              ) : (
                <div class="space-y-4 text-xs pb-10">
                  <div class="flex justify-between items-center bg-red-950/40 p-3 rounded-xl border border-red-800">
                    <span class="font-black text-red-400 flex items-center space-x-1.5">
                      <i class="fa-solid fa-radiation"></i>
                      <span>MASTER CONTROL COCKPIT</span>
                    </span>
                    <button onClick={() => setIsAdminAuth(false)} class="text-[10px] bg-red-900/60 px-2.5 py-1 rounded font-bold text-white">Lock</button>
                  </div>

                  {/* 1. APPROVE USER SUBMITTED MEMES FOR DUEL */}
                  <div class="bg-slate-50 dark:bg-[#111622] p-3.5 rounded-xl border border-slate-200 dark:border-[#1e2638] space-y-2">
                    <h4 class="font-bold uppercase tracking-wider text-[11px] text-orange-500">Meme Duel Approval Queue</h4>
                    {pendingDropSubmissions.length === 0 ? (
                      <p class="text-emerald-500 font-mono text-[10px]">✨ No pending meme uploads.</p>
                    ) : (
                      pendingDropSubmissions.map(sub => (
                        <div key={sub.id} class="p-2.5 bg-white dark:bg-black/40 rounded-lg border border-slate-200 dark:border-gray-800 flex items-center justify-between space-x-2">
                          <img src={sub.image_url} class="w-12 h-12 object-cover rounded" />
                          <div class="flex-1 truncate">
                            <span class="font-bold text-[10px] text-orange-400 block">{sub.author}</span>
                            <span class="text-gray-400 text-[10px] truncate block">{sub.suggested_caption || 'No caption'}</span>
                          </div>
                          <div class="flex space-x-1">
                            <button
                              onClick={() => handleAdminApproveSubmission(sub)}
                              class="bg-emerald-600 text-white px-2 py-1 rounded text-[10px] font-bold"
                            >
                              Approve
                            </button>
                            <button
                              onClick={() => setPendingDropSubmissions(pendingDropSubmissions.filter(x => x.id !== sub.id))}
                              class="bg-red-600 text-white px-2 py-1 rounded text-[10px] font-bold"
                            >
                              Reject
                            </button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  {/* 2. SEND DIRECT INBOX NOTIFICATION */}
                  <div class="bg-slate-50 dark:bg-[#111622] p-3.5 rounded-xl border border-slate-200 dark:border-[#1e2638] space-y-2">
                    <h4 class="font-bold uppercase tracking-wider text-[11px] text-orange-500">Dispatch Inbox Message</h4>
                    <div class="space-y-1.5">
                      <input
                        type="text"
                        placeholder="Target Handle (e.g. @chef_1234)"
                        value={inboxTargetUser}
                        onChange={(e) => setInboxTargetUser(e.target.value)}
                        class="w-full bg-white dark:bg-black border border-slate-300 dark:border-gray-700 rounded p-1.5 text-[10px] font-mono"
                      />
                      <input
                        type="text"
                        placeholder="Message Title"
                        value={inboxTitle}
                        onChange={(e) => setInboxTitle(e.target.value)}
                        class="w-full bg-white dark:bg-black border border-slate-300 dark:border-gray-700 rounded p-1.5 text-[10px]"
                      />
                      <textarea
                        placeholder="Notification text..."
                        value={inboxMessage}
                        onChange={(e) => setInboxMessage(e.target.value)}
                        class="w-full bg-white dark:bg-black border border-slate-300 dark:border-gray-700 rounded p-1.5 text-[10px] h-14 resize-none"
                      ></textarea>
                      <button
                        onClick={handleSendCustomNotification}
                        class="w-full py-1.5 bg-orange-600 text-white font-bold rounded text-[10px]"
                      >
                        Send to User's Inbox
                      </button>
                    </div>
                  </div>

                  {/* 3. MANUALLY PURGE USERNAMES */}
                  <div class="bg-slate-50 dark:bg-[#111622] p-3.5 rounded-xl border border-slate-200 dark:border-[#1e2638] space-y-2">
                    <h4 class="font-bold uppercase tracking-wider text-[11px] text-orange-500">Purge Username Lock</h4>
                    <button
                      onClick={async () => {
                        const target = prompt('Enter handle to purge from unique registration (e.g. @chef_99):');
                        if (target && isSupabaseLive) {
                          await supabase.from('user_profiles').delete().eq('username', target.trim().toLowerCase());
                          alert(`Username ${target} purged! Now free to register.`);
                        }
                      }}
                      class="w-full py-2 bg-red-800 text-white font-bold rounded text-[10px]"
                    >
                      Delete Handle From Database
                    </button>
                  </div>

                  {/* 4. CHANGE MASTER PIN */}
                  <div class="bg-slate-50 dark:bg-[#111622] p-3.5 rounded-xl border border-slate-200 dark:border-[#1e2638] space-y-2">
                    <h4 class="font-bold uppercase tracking-wider text-[11px] text-orange-500">Change Master PIN</h4>
                    <div class="flex space-x-2">
                      <input
                        type="text"
                        maxLength={4}
                        placeholder="New 4-digit PIN"
                        value={newPinInput}
                        onChange={(e) => setNewPinInput(e.target.value)}
                        class="bg-white dark:bg-black border border-slate-300 dark:border-gray-700 rounded p-1.5 text-[10px] font-mono flex-1"
                      />
                      <button
                        onClick={() => {
                          if (newPinInput.length === 4 && !isNaN(newPinInput)) {
                            setAdminPin(newPinInput);
                            if (isSupabaseLive) supabase.from('app_config').update({ admin_pin: newPinInput }).eq('id', 1);
                            setNewPinInput('');
                            setPinNotice(true);
                            setTimeout(() => setPinNotice(false), 3000);
                          } else alert('PIN must be 4 digits.');
                        }}
                        class="bg-orange-600 px-3 py-1.5 rounded font-bold text-white text-[10px]"
                      >
                        Update
                      </button>
                    </div>
                    {pinNotice && <p class="text-emerald-500 font-mono text-[9px]">PIN updated!</p>}
                  </div>
                </div>
              )}
            </div>
          )}
        </main>
      )}

      {/* INBOX / NOTIFICATIONS MODAL */}
      {showInbox && (
        <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white dark:bg-[#111622] border border-slate-200 dark:border-[#1e2638] w-full max-w-sm rounded-2xl p-5 space-y-3 shadow-2xl">
            <div class="flex justify-between items-center pb-2 border-b border-slate-200 dark:border-gray-800">
              <h3 class="font-black text-sm text-orange-500 flex items-center space-x-1.5">
                <i class="fa-solid fa-inbox"></i>
                <span>Notifications & Inbox</span>
              </h3>
              <button onClick={() => setShowInbox(false)} class="text-gray-400 hover:text-white">✕</button>
            </div>

            <div class="max-h-60 overflow-y-auto space-y-2">
              {notifications.length === 0 ? (
                <p class="text-xs text-gray-400 text-center py-4">No notifications yet.</p>
              ) : (
                notifications.map((n, i) => (
                  <div key={i} class="p-2.5 bg-slate-50 dark:bg-black/40 rounded-xl border border-slate-200 dark:border-gray-800 space-y-1">
                    <p class="font-bold text-xs">{n.title}</p>
                    <p class="text-[11px] text-gray-500">{n.message}</p>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      )}

      {/* BOTTOM TAB NAVIGATION */}
      <nav class="h-16 bg-white dark:bg-[#111622] border-t border-slate-200 dark:border-[#1c2433] flex items-center justify-around fixed bottom-0 left-0 right-0 max-w-md mx-auto z-10">
        <button onClick={() => setTab('duel')} class={`flex flex-col items-center ${tab === 'duel' ? 'text-orange-500' : 'text-gray-400'}`}>
          <i class="fa-solid fa-fire text-lg"></i>
          <span class="text-[10px] font-bold mt-1">Duel</span>
        </button>
        <button onClick={() => setTab('cook')} class={`flex flex-col items-center ${tab === 'cook' ? 'text-orange-500' : 'text-gray-400'}`}>
          <i class="fa-solid fa-utensils text-lg"></i>
          <span class="text-[10px] font-bold mt-1">Cook</span>
        </button>
        <button onClick={() => setTab('hall')} class={`flex flex-col items-center ${tab === 'hall' ? 'text-orange-500' : 'text-gray-400'}`}>
          <i class="fa-solid fa-trophy text-lg"></i>
          <span class="text-[10px] font-bold mt-1">Hall</span>
        </button>
        <button onClick={() => setTab('profile')} class={`flex flex-col items-center ${tab === 'profile' ? 'text-orange-500' : 'text-gray-400'}`}>
          <i class="fa-solid fa-user-gear text-lg"></i>
          <span class="text-[10px] font-bold mt-1">Profile</span>
        </button>
      </nav>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<CookedApp />);
</script>
</body>
</html>

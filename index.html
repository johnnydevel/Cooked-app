<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ==========================================
// 2. PROFANITY & ANTI-RAGEBAIT ENGINE
// ==========================================
class ContentFilterEngine {
  constructor() {
    this.slurs = ["nigger", "nigga", "faggot", "retard", "kike", "chink", "pedophile", "kys", "kill yourself"];
    this.vulgar = ["fuck", "shit", "bitch", "cunt", "whore", "slut", "dick", "pussy", "asshole"];
    this.leetspeak = { '@':'a', '4':'a', '$':'s', '5':'s', '0':'o', '1':'i', '!':'i', '3':'e', '7':'t' };
  }

  normalize(str) {
    let clean = str.toLowerCase();
    for (const [k, v] of Object.entries(this.leetspeak)) clean = clean.split(k).join(v);
    return clean.replace(/[^a-z0-9]/g, "");
  }

  evaluate(text) {
    const raw = text.toLowerCase();
    const clean = this.normalize(text);

    for (const s of this.slurs) {
      if (raw.includes(s) || clean.includes(s)) {
        return { safe: false, reason: "Hate Speech or severe slurs strictly prohibited.", level: "REJECT" };
      }
    }
    if (/https?:\/\/|\.gg\/|\.com/i.test(text)) {
      return { safe: false, reason: "Promotional links are blocked.", level: "REJECT" };
    }
    for (const v of this.vulgar) {
      if (raw.includes(v) || clean.includes(v)) {
        return { safe: false, reason: "Excessive Vulgarity", level: "FLAG" };
      }
    }
    return { safe: true, reason: "Approved", level: "CLEAN" };
  }
}

const filterEngine = new ContentFilterEngine();

// ==========================================
// 3. MAIN REACT APPLICATION
// ==========================================
function CookedApp() {
  // Navigation & Screens
  const [tab, setTab] = useState('duel'); // duel | cook | hall | profile | admin
  const [flameTaps, setFlameTaps] = useState(0);

  // App Master Configs
  const [adminPin, setAdminPin] = useState('1337');
  const [submissionsOpen, setSubmissionsOpen] = useState(true);
  const [votingOpen, setVotingOpen] = useState(true);
  const [maintenanceMode, setMaintenanceMode] = useState(false);
  const [adminBroadcast, setAdminBroadcast] = useState('');
  const [activeImage, setActiveImage] = useState('https://images.unsplash.com/photo-1543852786-1cf6624b9987?w=800');

  // Admin Cockpit State
  const [enteredPin, setEnteredPin] = useState('');
  const [isAdminAuth, setIsAdminAuth] = useState(false);
  const [newPinInput, setNewPinInput] = useState('');
  const [pinNotice, setPinNotice] = useState(false);

  // Chaos Engine State
  const [isEarthquake, setIsEarthquake] = useState(false);
  const [screenSticker, setScreenSticker] = useState(null);

  // User Profile Settings State
  const [userProfile, setUserProfile] = useState(() => ({
    username: localStorage.getItem('cooked_user') || `@Chef_${Math.floor(1000 + Math.random() * 9000)}`,
    avatar: localStorage.getItem('cooked_avatar') || 'fa-hat-chef',
    title: localStorage.getItem('cooked_title') || 'Line Cook',
    haptics: localStorage.getItem('cooked_haptics') !== 'false'
  }));

  // Game & Gamification State
  const [heatPoints, setHeatPoints] = useState(() => parseInt(localStorage.getItem('cooked_heat') || '45', 10));
  const [votedChoice, setVotedChoice] = useState(null);
  const [showTutorial, setShowTutorial] = useState(false);
  const [tutorialSlide, setTutorialSlide] = useState(0);

  // Submission Flow & Legal State
  const [pendingText, setPendingText] = useState('');
  const [hasAgreedTerms, setHasAgreedTerms] = useState(() => localStorage.getItem('cooked_terms') === 'true');
  const [showLegalModal, setShowLegalModal] = useState(false);
  const [modError, setModError] = useState('');

  // Auto Meme Studio State
  const [memeStudioOpen, setMemeStudioOpen] = useState(false);
  const [memeCaptionText, setMemeCaptionText] = useState('');
  const [memeLayoutMode, setMemeLayoutMode] = useState('overlay'); // 'overlay' | 'header'
  const canvasRef = useRef(null);

  // Data Pools
  const [captions, setCaptions] = useState([]);
  const [activePair, setActivePair] = useState([0, 1]);
  const [scheduledDrops, setScheduledDrops] = useState([]);
  const [calDate, setCalDate] = useState(new Date().toISOString().split('T')[0]);
  const [calTitle, setCalTitle] = useState('');
  const [calUrl, setCalUrl] = useState('');

  // Telemetry Metrics
  const [telemetry, setTelemetry] = useState({
    pageViews: 524,
    totalVotes: 139,
    uniqueUsers: 88,
    dbEstimatedSizeMb: 14.8
  });

  // Onboarding & Data Load
  useEffect(() => {
    if (!localStorage.getItem('cooked_first_launch')) {
      setShowTutorial(true);
      localStorage.setItem('cooked_first_launch', 'true');
    }
    loadData();
  }, []);

  const loadData = async () => {
    if (!isSupabaseLive) {
      setCaptions([
        { id: '1', author: '@SnoopChef', text: 'Me checking the fridge for the 4th time hoping new snacks spawned', wins: 84, losses: 16, flagged: false },
        { id: '2', author: '@ToastGod', text: 'My last brain cell calculating 7 + 8 on fingers during the exam', wins: 62, losses: 38, flagged: false },
        { id: '3', author: '@MidnightCat', text: 'Walking past the microwave with 00:01 left like a SWAT defuser', wins: 41, losses: 29, flagged: false },
        { id: '4', author: '@SpamKing', text: 'FREE DISCORD ROBUX AIRDROP CLICK PROFILE', wins: 1, losses: 99, flagged: true, flag_reason: 'Promotional links are blocked.' }
      ]);
      setScheduledDrops([
        { id: 'd1', target_date: '2026-09-29', title: 'Raccoon Trash Heist', image_url: 'https://images.unsplash.com/photo-1517849845537-4d257902454a?w=800' },
        { id: 'd2', target_date: '2026-09-30', title: 'Puzzled Doggo', image_url: 'https://images.unsplash.com/photo-1537151625747-768eb6cf92b2?w=800' }
      ]);
      return;
    }

    try {
      const { data: config } = await supabase.from('app_config').select('*').eq('id', 1).single();
      if (config) {
        setAdminPin(config.admin_pin || '1337');
        setSubmissionsOpen(config.submissions_open);
        setVotingOpen(config.voting_open);
        setMaintenanceMode(config.maintenance_mode);
        setAdminBroadcast(config.admin_broadcast || '');
        if (config.active_image) setActiveImage(config.active_image);
      }
      const { data: caps } = await supabase.from('captions').select('*').order('created_at', { ascending: false });
      if (caps && caps.length >= 2) setCaptions(caps);

      const { data: drops } = await supabase.from('scheduled_calendar_drops').select('*').order('target_date', { ascending: true });
      if (drops) setScheduledDrops(drops);

      const { data: telem } = await supabase.from('platform_telemetry').select('*').eq('id', 1).single();
      if (telem) {
        setTelemetry({
          pageViews: telem.total_page_views || 524,
          totalVotes: telem.total_votes_cast || 139,
          uniqueUsers: telem.unique_visitors || 88,
          dbEstimatedSizeMb: 14.8
        });
      }
    } catch (e) {
      console.error('Supabase load error:', e);
    }
  };

  const syncConfig = async (updates) => {
    if (!isSupabaseLive) return;
    await supabase.from('app_config').update(updates).eq('id', 1);
  };

  // Secret Triple Tap on Logo
  const handleLogoTap = () => {
    const next = flameTaps + 1;
    if (next >= 3) {
      setFlameTaps(0);
      setTab('admin');
    } else {
      setFlameTaps(next);
      setTimeout(() => setFlameTaps(0), 1200);
    }
  };

  const triggerHaptic = () => {
    if (userProfile.haptics && navigator.vibrate) {
      navigator.vibrate(40);
    }
  };

  // Voting Loop
  const handleVote = async (choice) => {
    if (!votingOpen || votedChoice !== null || captions.length < 2) return;
    triggerHaptic();
    setVotedChoice(choice);

    const updatedHeat = heatPoints + 1;
    setHeatPoints(updatedHeat);
    localStorage.setItem('cooked_heat', updatedHeat.toString());

    const winIdx = choice === 'A' ? activePair[0] : activePair[1];
    const loseIdx = choice === 'A' ? activePair[1] : activePair[0];
    const win = captions[winIdx];
    const lose = captions[loseIdx];

    if (isSupabaseLive) {
      if (win) await supabase.from('captions').update({ wins: (win.wins || 0) + 1 }).eq('id', win.id);
      if (lose) await supabase.from('captions').update({ losses: (lose.losses || 0) + 1 }).eq('id', lose.id);
    }
  };

  const nextDuel = () => {
    setVotedChoice(null);
    if (captions.length >= 2) {
      const a = Math.floor(Math.random() * captions.length);
      let b = Math.floor(Math.random() * captions.length);
      while (b === a) b = Math.floor(Math.random() * captions.length);
      setActivePair([a, b]);
    }
  };

  // Submission Flow
  const handleServeCaption = async () => {
    if (!pendingText.trim()) return;

    const evalRes = filterEngine.evaluate(pendingText);
    if (evalRes.level === "REJECT") {
      setModError(`❌ Blocked: ${evalRes.reason}`);
      return;
    }

    const flagged = evalRes.level === "FLAG";
    const item = {
      author: userProfile.username,
      text: pendingText.trim(),
      wins: 0,
      losses: 0,
      flagged: flagged,
      flag_reason: flagged ? evalRes.reason : ''
    };

    if (isSupabaseLive) {
      const { data } = await supabase.from('captions').insert([item]).select();
      if (data && data[0]) setCaptions([data[0], ...captions]);
    } else {
      setCaptions([{ ...item, id: Date.now().toString() }, ...captions]);
    }

    setPendingText('');
    setModError('');
    setHeatPoints(h => h + 10);
    localStorage.setItem('cooked_heat', (heatPoints + 10).toString());

    if (flagged) alert('⚠️ Quarantined for review: Vulgarity check.');
    else alert('🔥 Served to the live Arena!');
    setTab('duel');
  };

  // Auto Meme Studio Engine (HTML5 Canvas Live Stitiching)
  useEffect(() => {
    if (!memeStudioOpen || !canvasRef.current) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = activeImage;

    img.onload = () => {
      const width = 800;
      const height = 800;
      const text = memeCaptionText.toUpperCase() || "WRITE YOUR MEME TEXT";

      if (memeLayoutMode === 'header') {
        // Mode B: Modern Clean White Header Block on Top
        const headerHeight = 180;
        canvas.width = width;
        canvas.height = height + headerHeight;

        // Draw White Header Box
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, headerHeight);

        // Draw Text inside Header Box
        ctx.fillStyle = "#000000";
        ctx.font = "bold 34px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        wrapText(ctx, text, width / 2, headerHeight / 2 - 10, width - 60, 42);

        // Draw Attribution
        ctx.font = "bold 18px monospace";
        ctx.fillStyle = "#f97316";
        ctx.fillText(`COOKED.APP • ${userProfile.username}`, width / 2, headerHeight - 24);

        // Draw Image beneath Header Box
        ctx.drawImage(img, 0, headerHeight, width, height);
      } else {
        // Mode A: Classic Impact Overlay with Stroke
        canvas.width = width;
        canvas.height = height;
        ctx.drawImage(img, 0, 0, width, height);

        // Dark gradient overlay for legibility
        const grad = ctx.createLinearGradient(0, height - 250, 0, height);
        grad.addColorStop(0, "rgba(0,0,0,0)");
        grad.addColorStop(1, "rgba(0,0,0,0.85)");
        ctx.fillStyle = grad;
        ctx.fillRect(0, height - 250, width, 250);

        ctx.font = "900 48px Impact, sans-serif";
        ctx.textAlign = "center";
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 8;
        ctx.lineJoin = "round";

        wrapTextStroke(ctx, text, width / 2, height - 120, width - 60, 56);

        // Watermark badge
        ctx.font = "bold 20px monospace";
        ctx.fillStyle = "#f97316";
        ctx.fillText(`🔥 COOKED.APP • ${userProfile.username}`, width / 2, height - 30);
      }
    };
  }, [memeStudioOpen, memeCaptionText, memeLayoutMode, activeImage, userProfile.username]);

  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    const lines = [];
    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + ' ';
      if (ctx.measureText(testLine).width > maxWidth && n > 0) {
        lines.push(line);
        line = words[n] + ' ';
      } else {
        line = testLine;
      }
    }
    lines.push(line);
    const startY = y - ((lines.length - 1) * lineHeight) / 2;
    for (let k = 0; k < lines.length; k++) {
      ctx.fillText(lines[k].trim(), x, startY + (k * lineHeight));
    }
  }

  function wrapTextStroke(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    const lines = [];
    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + ' ';
      if (ctx.measureText(testLine).width > maxWidth && n > 0) {
        lines.push(line);
        line = words[n] + ' ';
      } else {
        line = testLine;
      }
    }
    lines.push(line);
    const startY = y - ((lines.length - 1) * lineHeight) / 2;
    for (let k = 0; k < lines.length; k++) {
      ctx.strokeText(lines[k].trim(), x, startY + (k * lineHeight));
      ctx.fillText(lines[k].trim(), x, startY + (k * lineHeight));
    }
  }

  const downloadMeme = () => {
    if (!canvasRef.current) return;
    const link = document.createElement('a');
    link.download = `cooked-meme-${Date.now()}.png`;
    link.href = canvasRef.current.toDataURL('image/png');
    link.click();
  };

  const capA = captions[activePair[0]] || captions[0];
  const capB = captions[activePair[1]] || captions[1];
  const totA = (capA?.wins || 0) + (capA?.losses || 0);
  const totB = (capB?.wins || 0) + (capB?.losses || 0);
  const pctA = totA + totB === 0 ? 50 : Math.round((totA / (totA + totB)) * 100);
  const pctB = 100 - pctA;

  return (
    <div class={`flex-1 flex flex-col justify-between ${isEarthquake ? 'shake-active' : ''}`}>

      {/* Top Banner Alert */}
      {adminBroadcast && (
        <div class="bg-red-600 px-4 py-2 text-xs font-black tracking-wide text-white flex justify-between items-center shadow-lg sticky top-0 z-30">
          <span class="flex items-center space-x-1.5 truncate">
            <i class="fa-solid fa-bullhorn text-[11px] animate-pulse"></i>
            <span>{adminBroadcast}</span>
          </span>
          <button onClick={() => { setAdminBroadcast(''); syncConfig({ admin_broadcast: '' }); }} class="text-white ml-2">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      )}

      {/* Header Bar */}
      <header class="p-4 flex items-center justify-between border-b border-[#1c2433] bg-[#111622]/90 backdrop-blur-md sticky top-0 z-20">
        <div class="flex items-center space-x-2">
          <button onClick={handleLogoTap} class="text-xl font-black text-orange-500 tracking-wider flex items-center space-x-1 active:scale-95 transition">
            <i class="fa-solid fa-fire-flame-curved text-orange-500 text-glow"></i>
            <span>COOKED</span>
          </button>
          <span class="text-[9px] bg-[#1d2535] text-gray-400 font-mono px-2 py-0.5 rounded font-bold uppercase border border-gray-800">
            {isSupabaseLive ? 'LIVE' : 'PREVIEW'}
          </span>
        </div>

        <div class="flex items-center space-x-2">
          <button onClick={() => setTab('profile')} class="flex items-center space-x-1.5 bg-[#171f2e] border border-[#232e42] px-2.5 py-1 rounded-full text-xs font-bold text-gray-200 active:scale-95 transition">
            <i class={`fa-solid ${userProfile.avatar} text-orange-400`}></i>
            <span class="truncate max-w-[80px]">{userProfile.username}</span>
          </button>

          <div class="flex items-center space-x-1 text-orange-400 font-bold bg-[#171f2e] border border-orange-500/20 px-2 py-1 rounded-full text-xs font-mono">
            <i class="fa-solid fa-fire text-xs"></i>
            <span>{heatPoints}</span>
          </div>
        </div>
      </header>

      {/* Main Views Container */}
      {maintenanceMode && tab !== 'admin' ? (
        <div class="flex-1 flex flex-col items-center justify-center p-6 text-center">
          <i class="fa-solid fa-screwdriver-wrench text-5xl text-orange-400 mb-4 animate-bounce"></i>
          <h2 class="text-xl font-black mb-2 text-white">Emergency Maintenance</h2>
          <p class="text-gray-400 text-xs max-w-xs">The chef is cleaning the kitchen floor. Battles will resume momentarily.</p>
        </div>
      ) : (
        <main class="flex-1 flex flex-col p-4 overflow-y-auto">

          {/* TAB 1: ARENA DUEL SCREEN */}
          {tab === 'duel' && (
            <div class="flex-1 flex flex-col justify-between space-y-4">
              <div class="relative w-full h-64 bg-black rounded-2xl overflow-hidden border border-[#1e2638] shadow-2xl">
                <img src={activeImage} class="w-full h-full object-cover" />
                <div class="absolute top-2.5 right-2.5 bg-black/75 backdrop-blur-md px-2.5 py-1 rounded-full text-[10px] font-mono font-bold text-gray-300 border border-gray-700">
                  <i class="fa-solid fa-bolt text-amber-400 mr-1"></i>DROP #42
                </div>
                {screenSticker && (
                  <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <span class="text-7xl animate-bounce">{screenSticker}</span>
                  </div>
                )}
              </div>

              {/* Matchup Duel Cards */}
              <div class="space-y-3">
                <button
                  disabled={!votingOpen}
                  onClick={() => handleVote('A')}
                  class={`w-full text-left p-4 rounded-xl border transition relative overflow-hidden ${
                    votedChoice === 'A'
                      ? 'border-emerald-500 bg-emerald-950/40 shadow-lg'
                      : votedChoice === 'B'
                      ? 'border-[#1e2638] bg-[#111622] opacity-35'
                      : 'border-[#1e2638] bg-[#111622] active:scale-[0.98]'
                  }`}
                >
                  <p class="text-sm font-semibold text-gray-100 leading-snug">{capA?.text}</p>
                  <div class="mt-2.5 flex justify-between items-center text-xs font-mono text-gray-400">
                    <span class="flex items-center space-x-1">
                      <i class="fa-solid fa-user-ninja text-[11px] text-gray-500"></i>
                      <span>{capA?.author}</span>
                    </span>
                    {votedChoice !== null && <span class="text-emerald-400 font-bold font-mono text-sm">{pctA}%</span>}
                  </div>
                </button>

                <div class="text-center text-[10px] font-black text-gray-600 tracking-widest">- VS -</div>

                <button
                  disabled={!votingOpen}
                  onClick={() => handleVote('B')}
                  class={`w-full text-left p-4 rounded-xl border transition relative overflow-hidden ${
                    votedChoice === 'B'

          <span class="text-[10px] font-bold mt-1">Hall</span>
        </button>
        <button onClick={() => setTab('profile')} class={`flex flex-col items-center ${tab === 'profile' ? 'text-orange-500' : 'text-gray-400'}`}>
          <i class="fa-solid fa-user-gear text-lg"></i>
          <span class="text-[10px] font-bold mt-1">Profile</span>
        </button>
      </nav>

      {/* AUTO MEME MAKER MODAL (CANVAS ENGINE) */}
      {memeStudioOpen && (
        <div class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex flex-col p-4 overflow-y-auto">
          <div class="flex justify-between items-center pb-3 border-b border-gray-800">
            <h3 class="font-black text-sm text-orange-400 flex items-center space-x-1.5">
              <i class="fa-solid fa-wand-magic-sparkles"></i>
              <span>Auto Meme Maker Studio</span>
            </h3>
            <button onClick={() => setMemeStudioOpen(false)} class="text-gray-400 hover:text-white text-base">✕</button>
          </div>

          <div class="flex-1 flex flex-col items-center justify-center py-4 space-y-4">
            {/* Live Canvas Stitched Output */}
            <div class="w-full max-w-xs rounded-xl overflow-hidden shadow-2xl border border-gray-800 bg-black">
              <canvas ref={canvasRef} class="w-full h-auto block"></canvas>
            </div>

            {/* Layout Toggle */}
            <div class="flex bg-[#111622] p-1 rounded-xl border border-gray-800 w-full max-w-xs">
              <button
                onClick={() => setMemeLayoutMode('overlay')}
                class={`flex-1 py-1.5 text-xs font-bold rounded-lg transition ${
                  memeLayoutMode === 'overlay' ? 'bg-orange-600 text-white shadow' : 'text-gray-400'
                }`}
              >
                Classic Overlay
              </button>
              <button
                onClick={() => setMemeLayoutMode('header')}
                class={`flex-1 py-1.5 text-xs font-bold rounded-lg transition ${
                  memeLayoutMode === 'header' ? 'bg-orange-600 text-white shadow' : 'text-gray-400'
                }`}
              >
                Top Header Block
              </button>
            </div>

            {/* Caption Input */}
            <div class="w-full max-w-xs">
              <input
                type="text"
                value={memeCaptionText}
                onChange={(e) => setMemeCaptionText(e.target.value)}
                placeholder="Type meme text to live-render..."
                class="w-full bg-[#111622] border border-gray-700 rounded-xl p-3 text-xs font-mono text-white focus:outline-none focus:border-orange-500"
              />
            </div>
          </div>

          {/* Download & Save Action */}
          <div class="w-full max-w-xs mx-auto pb-4">
            <button
              onClick={downloadMeme}
              class="w-full py-3.5 bg-orange-600 hover:bg-orange-500 font-bold rounded-xl text-xs text-white shadow-xl flex items-center justify-center space-x-2"
            >
              <i class="fa-solid fa-download"></i>
              <span>Download & Share Meme (.PNG)</span>
            </button>
          </div>
        </div>
      )}

      {/* GLIDING ONBOARDING COOKING PAD */}
      {showTutorial && (
        <div class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-6">
          <div class="bg-[#171f2c] border border-orange-500/50 w-full max-w-sm rounded-3xl p-6 shadow-2xl flex flex-col items-center text-center space-y-4">
            <div class="w-16 h-16 bg-orange-950/60 border border-orange-500/30 rounded-2xl flex items-center justify-center text-2xl text-orange-400">
              <i class={`fa-solid ${tutorialSlides[tutorialSlide].icon}`}></i>
            </div>
            <h3 class="text-lg font-black text-white">{tutorialSlides[tutorialSlide].title}</h3>
            <p class="text-xs text-gray-300 leading-relaxed min-h-[50px]">{tutorialSlides[tutorialSlide].desc}</p>
            <div class="flex space-x-1.5 pt-2">
              {[0, 1, 2].map((i) => (
                <div key={i} class={`h-1.5 rounded-full transition-all ${i === tutorialSlide ? 'w-6 bg-orange-500' : 'w-2 bg-gray-700'}`}></div>
              ))}
            </div>
            <div class="w-full pt-2">
              {tutorialSlide < 2 ? (
                <button onClick={() => setTutorialSlide(s => s + 1)} class="w-full py-3 bg-orange-600 font-bold rounded-xl text-xs active:scale-95 transition text-white">Next Slide →</button>
              ) : (
                <button onClick={() => setShowTutorial(false)} class="w-full py-3 bg-emerald-600 font-bold rounded-xl text-xs active:scale-95 transition text-white">Let's Cook! 🔥</button>
              )}
            </div>
          </div>
        </div>
      )}

      {/* UGC & LEGAL AGREEMENT MODAL */}
      {showLegalModal && (
        <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4">
          <div class="bg-[#111622] border border-[#1e2638] w-full max-w-sm rounded-2xl p-5 space-y-4 max-h-[85vh] overflow-y-auto">
            <h3 class="font-black text-sm text-orange-500 flex items-center space-x-2">
              <i class="fa-solid fa-file-contract"></i>
              <span>Community Guidelines & Terms</span>
            </h3>
            <div class="text-[11px] text-gray-300 space-y-2 bg-black/40 p-3 rounded-lg border border-gray-800 font-mono leading-relaxed">
              <p><strong>1. Zero Tolerance:</strong> No harassment, hate speech, slurs, or NSFW descriptions. Violators are quarantined and banned.</p>
              <p><strong>2. UGC Rights:</strong> Submitting grants COOKED an irrevocable worldwide license to display and distribute text on app feeds and social media exports.</p>
              <p><strong>3. Minimum Age:</strong> You verify that you meet the age requirements for digital consent (13+) in your region.</p>
            </div>
            <div class="flex items-center space-x-2">
              <input type="checkbox" id="legalAgreeCheck" class="w-4 h-4 accent-orange-500" />
              <label for="legalAgreeCheck" class="text-xs text-gray-300">I agree to the Community Terms</label>
            </div>
            <div class="flex space-x-2 pt-2">
              <button onClick={() => setShowLegalModal(false)} class="flex-1 py-2.5 bg-gray-800 rounded-xl text-xs font-bold text-gray-400">Cancel</button>
              <button
                onClick={() => {
                  const check = document.getElementById('legalAgreeCheck');
                  if (!check || !check.checked) return alert('You must accept terms.');
                  setHasAgreedTerms(true);
                  localStorage.setItem('cooked_terms', 'true');
                  setShowLegalModal(false);
                  handleServeCaption();
                }}
                class="flex-1 py-2.5 bg-orange-600 rounded-xl text-xs font-bold text-white active:scale-95 transition"
              >
                Accept & Post
              </button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<CookedApp />);
</script>
</body>
</html>

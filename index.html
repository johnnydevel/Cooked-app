<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>COOKED</title>
  
  <!-- Modern CDN Stack -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          colors: {
            brand: '#ea580c'
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body {
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    @keyframes screenShake {
      0% { transform: translate(2px, 1px) rotate(0deg); }
      20% { transform: translate(-3px, 0px) rotate(1deg); }
      40% { transform: translate(1px, -1px) rotate(1deg); }
      60% { transform: translate(-3px, 1px) rotate(0deg); }
      80% { transform: translate(-1px, -1px) rotate(1deg); }
      100% { transform: translate(1px, -2px) rotate(-1deg); }
    }
    .shake-active { animation: screenShake 0.3s infinite ease-in-out; }
  </style>
</head>
<body class="flex justify-center min-h-screen bg-slate-100 dark:bg-[#07090e] text-slate-900 dark:text-slate-100 transition-colors">

<div id="root" class="w-full max-w-md min-h-screen flex flex-col bg-white dark:bg-[#0b0e14] border-x border-slate-200 dark:border-[#1a2233] relative pb-20 shadow-2xl"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// --- PASTE YOUR SUPABASE KEYS HERE ---
const SUPABASE_URL = "https://bivhoztjletdxhyehonx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpdmhvenRqbGV0ZHhoeWVob254Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MTgzNzksImV4cCI6MjEwNjE5NDM3OX0.l9gXu35qxhYLUf2cVXXL4KUEH20rE7aOld5D1iGz7hE";

const isLive = (
  SUPABASE_URL !== "https://bivhoztjletdxhyehonx.supabase.co" &&
  SUPABASE_ANON_KEY !== "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpdmhvenRqbGV0ZHhoeWVob254Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MTgzNzksImV4cCI6MjEwNjE5NDM3OX0.l9gXu35qxhYLUf2cVXXL4KUEH20rE7aOld5D1iGz7hE" &&
  SUPABASE_URL.startsWith("https://")
);

const supabase = isLive ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

// Built-in bad word filter
const BANNED_WORDS = ["nigger", "nigga", "faggot", "retard", "kike", "chink", "pedophile", "kys"];
function containsSlurs(text) {
  const clean = text.toLowerCase().replace(/[^a-z0-9]/g, "");
  return BANNED_WORDS.some(w => clean.includes(w));
}

function App() {
  const [tab, setTab] = useState('duel'); // duel | cook | hall | profile | admin
  const [flameTaps, setFlameTaps] = useState(0);

  // App Configurations
  const [adminPin, setAdminPin] = useState('1337');
  const [submissionsOpen, setSubmissionsOpen] = useState(true);
  const [votingOpen, setVotingOpen] = useState(true);
  const [maintenanceMode, setMaintenanceMode] = useState(false);
  const [adminBroadcast, setAdminBroadcast] = useState('');
  const [activeImage, setActiveImage] = useState('https://images.unsplash.com/photo-1543852786-1cf6624b9987?w=800');
  const [activeCaption, setActiveCaption] = useState('WHEN THE CODE COMPILES ON THE VERY FIRST TRY');

  // Admin Cockpit
  const [enteredPin, setEnteredPin] = useState('');
  const [isAdminAuth, setIsAdminAuth] = useState(false);
  const [newPinInput, setNewPinInput] = useState('');
  const [isShaking, setIsShaking] = useState(false);

  // User Profile
  const [username, setUsername] = useState(() => localStorage.getItem('c_user') || `@chef_${Math.floor(1000 + Math.random() * 9000)}`);
  const [avatar, setAvatar] = useState(() => localStorage.getItem('c_avatar') || 'fa-hat-chef');
  const [title, setTitle] = useState(() => localStorage.getItem('c_title') || 'Line Cook');
  const [spices, setSpices] = useState(() => parseInt(localStorage.getItem('c_spices') || '25', 10));
  const [userStatus, setUserStatus] = useState('');

  // Notifications
  const [notifications, setNotifications] = useState([]);
  const [showInbox, setShowInbox] = useState(false);
  const [customUser, setCustomUser] = useState('');
  const [customTitle, setCustomTitle] = useState('');
  const [customMsg, setCustomMsg] = useState('');

  // Submissions (User uploading meme file or URL)
  const [submitCaption, setSubmitCaption] = useState('');
  const [submitFile, setSubmitFile] = useState(null);
  const [submitUrl, setSubmitUrl] = useState('');
  const [pendingDrops, setPendingDrops] = useState([]);

  // Duels
  const [captions, setCaptions] = useState([]);
  const [pair, setPair] = useState([0, 1]);
  const [votedChoice, setVotedChoice] = useState(null);

  // Hall of Fame Stitched Meme Data
  const [crownedMemeUrl, setCrownedMemeUrl] = useState(null);

  useEffect(() => {
    loadLiveState();
    loadInbox();
  }, [username]);

  // Load from Supabase
  const loadLiveState = async () => {
    if (!isLive) {
      setCaptions([
        { id: '1', author: '@SnoopChef', text: 'Checking the fridge at 3 AM hoping a feast miraculously spawned', wins: 42, losses: 11 },
        { id: '2', author: '@ToastGod', text: 'Calculating 7 + 8 on fingers just to be 100% sure in the exam', wins: 38, losses: 14 }
      ]);
      setPendingDrops([
        { id: 'p1', author: '@HamsterFan', image_url: 'https://images.unsplash.com/photo-1548767797-d8c844163c4c?w=800', caption: 'Staring into soul' }
      ]);
      stitchServerHeader(activeCaption, activeImage, '@MemeSavant');
      return;
    }

    try {
      const { data: config } = await supabase.from('app_config').select('*').eq('id', 1).single();
      if (config) {
        setAdminPin(config.admin_pin || '1337');
        setSubmissionsOpen(config.submissions_open);
        setVotingOpen(config.voting_open);
        setMaintenanceMode(config.maintenance_mode);
        setAdminBroadcast(config.admin_broadcast || '');
        if (config.active_image) setActiveImage(config.active_image);
        if (config.active_caption) setActiveCaption(config.active_caption);
      }

      const { data: caps } = await supabase.from('captions').select('*').order('created_at', { ascending: false });
      if (caps && caps.length >= 2) setCaptions(caps);

      const { data: drops } = await supabase.from('drop_submissions').select('*').eq('status', 'pending');
      if (drops) setPendingDrops(drops);

      stitchServerHeader(config?.active_caption || activeCaption, config?.active_image || activeImage, '@MemeSavant');
    } catch (e) {
      console.error(e);
    }
  };

  const loadInbox = async () => {
    if (!isLive) {
      setNotifications([
        { id: 'n1', title: 'Welcome to COOKED!', message: 'Vote once every 12h in the Arena to claim +5 Spices.' }
      ]);
      return;
    }
    const { data } = await supabase.from('user_notifications')
      .select('*')
      .eq('target_username', username.toLowerCase())
      .order('created_at', { ascending: false });
    if (data) setNotifications(data);
  };

  // Pure Server-Style Auto Meme Stitcher (Puts text box up on top of the image)
  const stitchServerHeader = (text, imgUrl, author) => {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = imgUrl;

    img.onload = () => {
      const width = 800;
      const height = 800;
      const headerH = 180;
      canvas.width = width;
      canvas.height = height + headerH;

      // Solid White Top Header Block
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, headerH);

      // Black Impact Text Inside Header
      ctx.fillStyle = "#000000";
      ctx.font = "bold 32px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const words = (text || "CROWNED MEME").toUpperCase().split(' ');
      let line = '';
      const lines = [];
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        if (ctx.measureText(testLine).width > width - 80 && n > 0) {
          lines.push(line);
          line = words[n] + ' ';
        } else {
          line = testLine;
        }
      }
      lines.push(line);

      const startY = (headerH / 2) - ((lines.length - 1) * 20) - 10;
      lines.forEach((l, i) => {
        ctx.fillText(l.trim(), width / 2, startY + (i * 40));
      });

      // Attribution
      ctx.font = "bold 15px monospace";
      ctx.fillStyle = "#ea580c";
      ctx.fillText(`COOKED.APP • ${author.toUpperCase()}`, width / 2, headerH - 22);

      // Draw Main Image Beneath Header
      ctx.drawImage(img, 0, headerH, width, height);

      setCrownedMemeUrl(canvas.toDataURL('image/png'));
    };
  };

  // Profile Auto-Save & Enforced Unique @ Handle
  const handleHandleChange = (e) => {
    let raw = e.target.value.toLowerCase().replace(/\s+/g, '');
    if (!raw.startsWith('@')) raw = '@' + raw.replace(/@/g, '');
    setUsername(raw);
    setUserStatus('Checking uniqueness...');
  };

  useEffect(() => {
    const timer = setTimeout(async () => {
      if (username.length < 3) {
        setUserStatus('Minimum 3 characters');
        return;
      }
      if (isLive) {
        const { data } = await supabase.from('user_profiles').select('username').eq('username', username);
        if (data && data.length > 0 && username !== localStorage.getItem('c_user')) {
          setUserStatus('⚠️ Handle taken! Choose another.');
          return;
        }
        await supabase.from('user_profiles').upsert({
          username: username,
          avatar: avatar,
          title: title,
          spices: spices
        }, { onConflict: 'username' });
      }
      localStorage.setItem('c_user', username);
      localStorage.setItem('c_avatar', avatar);
      localStorage.setItem('c_title', title);
      localStorage.setItem('c_spices', spices.toString());
      setUserStatus('✓ Auto-saved & unique');
    }, 500);
    return () => clearTimeout(timer);
  }, [username, avatar, title]);

  // Voting & 12h Spices Earning
  const handleVote = async (choice) => {
    if (!votingOpen || votedChoice !== null || captions.length < 2) return;
    setVotedChoice(choice);

    const now = Date.now();
    const lastVoted = parseInt(localStorage.getItem('c_last_voted') || '0', 10);
    if (now - lastVoted > 12 * 60 * 60 * 1000) {
      const nextSpices = spices + 5;
      setSpices(nextSpices);
      localStorage.setItem('c_spices', nextSpices.toString());
      localStorage.setItem('c_last_voted', now.toString());

      const notif = {
        target_username: username.toLowerCase(),
        title: '🔥 +5 Spices Claimed!',
        message: 'You cast your 12-hour vote duty in the Arena.'
      };
      if (isLive) await supabase.from('user_notifications').insert([notif]);
      setNotifications(prev => [notif, ...prev]);

      if (window.confetti) window.confetti({ particleCount: 100, spread: 60 });
    }

    const winIdx = choice === 'A' ? pair[0] : pair[1];
    const loseIdx = choice === 'A' ? pair[1] : pair[0];
    if (isLive) {
      const win = captions[winIdx];
      const lose = captions[loseIdx];
      if (win) await supabase.from('captions').update({ wins: (win.wins || 0) + 1 }).eq('id', win.id);
      if (lose) await supabase.from('captions').update({ losses: (lose.losses || 0) + 1 }).eq('id', lose.id);
    }
  };

  const nextDuel = () => {
    setVotedChoice(null);
    if (captions.length >= 2) {
      const a = Math.floor(Math.random() * captions.length);
      let b = Math.floor(Math.random() * captions.length);
      while (b === a) b = Math.floor(Math.random() * captions.length);
      setPair([a, b]);
    }
  };

  // Submit User Meme (Upload file to Supabase Storage or paste URL)
  const handleUploadMeme = async () => {
    if (!submitCaption.trim()) return alert('Please enter a caption.');
    if (containsSlurs(submitCaption)) return alert('Submission contains prohibited slurs.');

    let finalImageUrl = submitUrl.trim();

    if (submitFile && isLive) {
      const ext = submitFile.name.split('.').pop();
      const path = `${Date.now()}-${Math.random().toString(36).substring(2)}.${ext}`;
      const { error } = await supabase.storage.from('memes').upload(path, submitFile);
      if (error) return alert(`Upload error: ${error.message}`);
      const { data } = supabase.storage.from('memes').getPublicUrl(path);
      finalImageUrl = data.publicUrl;
    }

    if (!finalImageUrl) return alert('Please upload an image file or paste a direct image URL.');

    const newSub = {
      author: username,
      image_url: finalImageUrl,
      caption: submitCaption.trim(),
      status: 'pending'
    };

    if (isLive) {
      await supabase.from('drop_submissions').insert([newSub]);
    } else {
      setPendingDrops([...pendingDrops, { ...newSub, id: Date.now().toString() }]);
    }

    setSubmitCaption('');
    setSubmitUrl('');
    setSubmitFile(null);
    alert('Meme sent to Admin for duel approval!');
    setTab('duel');
  };

  // Admin approves submission
  const handleApproveSubmission = async (sub) => {
    setActiveImage(sub.image_url);
    setActiveCaption(sub.caption);

    const notif = {
      target_username: sub.author.toLowerCase(),
      title: '🎉 Your Meme Was Approved!',
      message: 'Your drop is now LIVE in the Arena! You received +25 Spices.'
    };

    if (isLive) {
      await supabase.from('drop_submissions').update({ status: 'approved' }).eq('id', sub.id);
      await supabase.from('app_config').update({ active_image: sub.image_url, active_caption: sub.caption }).eq('id', 1);
      await supabase.from('user_notifications').insert([notif]);
      const { data: prof } = await supabase.from('user_profiles').select('spices').eq('username', sub.author).single();
      if (prof) await supabase.from('user_profiles').update({ spices: prof.spices + 25 }).eq('username', sub.author);
    }

    stitchServerHeader(sub.caption, sub.image_url, sub.author);
    setPendingDrops(pendingDrops.filter(x => x.id !== sub.id));
    alert(`Approved! Notification sent to ${sub.author}`);
  };

  // Admin custom notification dispatcher
  const handleSendInbox = async () => {
    if (!customUser || !customTitle || !customMsg) return alert('Fill out all inbox fields.');
    const notif = {
      target_username: customUser.toLowerCase().trim(),
      title: customTitle.trim(),
      message: customMsg.trim()
    };
    if (isLive) await supabase.from('user_notifications').insert([notif]);
    if (customUser.toLowerCase().trim() === username.toLowerCase()) {
      setNotifications([notif, ...notifications]);
    }
    setCustomTitle('');
    setCustomMsg('');
    alert(`Delivered to ${customUser}'s inbox!`);
  };

  const capA = captions[pair[0]] || captions[0];
  const capB = captions[pair[1]] || captions[1];
  const totA = (capA?.wins || 0) + (capA?.losses || 0);
  const totB = (capB?.wins || 0) + (capB?.losses || 0);
  const pctA = totA + totB === 0 ? 50 : Math.round((totA / (totA + totB)) * 100);
  const pctB = 100 - pctA;

  return (
    <div class={`flex-1 flex flex-col justify-between ${isShaking ? 'shake-active' : ''}`}>

      {/* Broadcast Alert */}
      {adminBroadcast && (
        <div class="bg-red-600 px-4 py-2 text-xs font-black tracking-wide text-white flex justify-between items-center shadow-lg sticky top-0 z-30">
          <span class="truncate"><i class="fa-solid fa-bullhorn mr-1.5"></i>{adminBroadcast}</span>
          <button onClick={() => { setAdminBroadcast(''); if (isLive) supabase.from('app_config').update({ admin_broadcast: '' }).eq('id', 1); }}>✕</button>
        </div>
      )}

      {/* Top Bar */}
      <header class="p-4 flex items-center justify-between border-b border-slate-200 dark:border-[#1c2433] bg-white/90 dark:bg-[#111622]/90 backdrop-blur-md sticky top-0 z-20">
        <div class="flex items-center space-x-2">
          <button
            onClick={() => {
              const next = flameTaps + 1;
              if (next >= 3) { setFlameTaps(0); setTab('admin'); }
              else { setFlameTaps(next); setTimeout(() => setFlameTaps(0), 1200); }
            }}
            class="text-xl font-black text-orange-600 dark:text-orange-500 tracking-wider flex items-center space-x-1 active:scale-95"
          >
            <i class="fa-solid fa-fire-flame-curved"></i>
            <span>COOKED</span>
          </button>
          <span class="text-[9px] bg-slate-200 dark:bg-[#1d2535] text-slate-600 dark:text-gray-400 font-mono px-2 py-0.5 rounded font-bold uppercase">
            {isLive ? 'LIVE' : 'PREVIEW'}
          </span>
        </div>

        <div class="flex items-center space-x-2">
          <button
            onClick={() => setShowInbox(true)}
            class="relative w-8 h-8 rounded-full bg-slate-100 dark:bg-[#171f2e] border border-slate-300 dark:border-[#232e42] flex items-center justify-center text-xs active:scale-95"
          >
            <i class="fa-solid fa-bell"></i>
            {notifications.length > 0 && (
              <span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white dark:border-black"></span>
            )}
          </button>

          <div class="flex items-center space-x-1.5 text-orange-600 dark:text-orange-400 font-bold bg-orange-50 dark:bg-[#171f2e] border border-orange-200 dark:border-orange-500/20 px-2.5 py-1 rounded-full text-xs font-mono">
            <i class="fa-solid fa-pepper-hot"></i>
            <span>{spices}</span>
          </div>
        </div>
      </header>

      {/* Main Views */}
      {maintenanceMode && tab !== 'admin' ? (
        <div class="flex-1 flex flex-col items-center justify-center p-6 text-center">
          <i class="fa-solid fa-screwdriver-wrench text-5xl text-orange-500 mb-4 animate-bounce"></i>
          <h2 class="text-xl font-black mb-2">Emergency Maintenance</h2>
          <p class="text-xs text-gray-500">The kitchen is closed for scrubbing. Battles resume shortly.</p>
        </div>
      ) : (
        <main class="flex-1 flex flex-col p-4 overflow-y-auto">

          {/* TAB 1: ARENA DUEL */}
          {tab === 'duel' && (
            <div class="flex-1 flex flex-col justify-between space-y-4">
              <div class="relative w-full h-64 bg-black rounded-2xl overflow-hidden border border-slate-200 dark:border-[#1e2638] shadow-2xl">
                <img src={activeImage} class="w-full h-full object-cover" />
                <div class="absolute top-2.5 right-2.5 bg-black/75 backdrop-blur-md px-2.5 py-1 rounded-full text-[10px] font-mono font-bold text-gray-300 border border-gray-700">
                  <i class="fa-solid fa-bolt text-amber-400 mr-1"></i>ACTIVE DROP
                </div>
              </div>

              <div class="space-y-3">
                <button
                  disabled={!votingOpen}
                  onClick={() => handleVote('A')}
                  class={`w-full text-left p-4 rounded-xl border transition relative overflow-hidden ${
                    votedChoice === 'A'
                      ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 shadow-lg'
                      : votedChoice === 'B'
                      ? 'opacity-40 border-slate-200 dark:border-[#1e2638] bg-slate-50 dark:bg-[#111622]'
                      : 'border-slate-200 dark:border-[#1e2638] bg-slate-50 dark:bg-[#111622] active:scale-[0.98]'
                  }`}
                >
                  <p class="text-sm font-semibold leading-snug">{capA?.text}</p>
                  <div class="mt-2.5 flex justify-between items-center text-xs font-mono text-gray-500">
                    <span><i class="fa-solid fa-user-ninja mr-1"></i>{capA?.author}</span>
                    {votedChoice !== null && <span class="text-emerald-500 font-bold">{pctA}%</span>}
                  </div>
                </button>

                <div class="text-center text-[10px] font-black text-gray-400 tracking-widest">- VS -</div>

                <button
                  disabled={!votingOpen}
                  onClick={() => handleVote('B')}
                  class={`w-full text-left p-4 rounded-xl border transition relative overflow-hidden ${
                    votedChoice === 'B'
                      ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/40 shadow-lg'
                      : votedChoice === 'A'
                      ? 'opacity-40 border-slate-200 dark:border-[#1e2638] bg-slate-50 dark:bg-[#111622]'
                      : 'border-slate-200 dark:border-[#1e2638] bg-slate-50 dark:bg-[#111622] active:scale-[0.98]'
                  }`}
                >
                  <p class="text-sm font-semibold leading-snug">{capB?.text}</p>
                  <div class="mt-2.5 flex justify-between items-center text-xs font-mono text-gray-500">
                    <span><i class="fa-solid fa-user-ninja mr-1"></i>{capB?.author}</span>
                    {votedChoice !== null && <span class="text-emerald-500 font-bold">{pctB}%</span>}
                  </div>
                </button>
              </div>

              {votedChoice !== null ? (
                <button onClick={nextDuel} class="w-full py-3.5 bg-orange-600 hover:bg-orange-500 font-bold rounded-xl active:scale-95 text-white shadow-lg">
                  Next Duel →
                </button>
              ) : (
                <div class="flex justify-between items-center text-xs text-gray-500 px-2 font-medium">
                  <span>Vote once every 12h for +5 Spices</span>
                  <button onClick={nextDuel} class="hover:text-orange-500">Skip <i class="fa-solid fa-forward-step ml-1"></i></button>
                </div>
              )}
            </div>
          )}

          {/* TAB 2: COOK (UPLOAD MEMES FOR THE DUEL) */}
          {tab === 'cook' && (
            <div class="flex-1 flex flex-col justify-between space-y-4">
              <div>
                <h2 class="text-lg font-black mb-1 flex items-center space-x-2">
                  <i class="fa-solid fa-cloud-arrow-up text-orange-500"></i>
                  <span>Upload Meme for Duel</span>
                </h2>
                <p class="text-xs text-gray-500 mb-4">Send a meme for approval. Approved entries become active drops and earn you +25 Spices.</p>

                {!submissionsOpen ? (
                  <div class="p-4 bg-red-950/20 border border-red-800 rounded-xl text-center text-xs text-red-400">
                    🔒 Submissions are currently locked by the Admin.
                  </div>
                ) : (
                  <div class="space-y-3">
                    <div>
                      <label class="text-xs font-bold text-gray-500 block mb-1">Upload Image File</label>
                      <input
                        type="file"
                        accept="image/*"
                        onChange={(e) => setSubmitFile(e.target.files[0])}
                        class="w-full text-xs font-mono file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-orange-600 file:text-white"
                      />
                    </div>

                    <div class="text-center text-[10px] font-black text-gray-400">OR DIRECT URL</div>

                    <div>
                      <input
                        type="text"
                        placeholder="https://... direct image link"
                        value={submitUrl}
                        onChange={(e) => setSubmitUrl(e.target.value)}
                        class="w-full bg-slate-50 dark:bg-[#111622] border border-slate-300 dark:border-[#1e2638] rounded-xl p-3 text-xs font-mono focus:outline-none focus:border-orange-500"
                      />
                    </div>

                    <div>
                      <label class="text-xs font-bold text-gray-500 block mb-1">Meme Top Caption</label>
                      <textarea
                        placeholder="Type header caption..."
                        value={submitCaption}
                        onChange={(e) => setSubmitCaption(e.target.value.slice(0, 65))}
                        class="w-full bg-slate-50 dark:bg-[#111622] border border-slate-300 dark:border-[#1e2638] rounded-xl p-3 text-xs h-20 resize-none focus:outline-none focus:border-orange-500"
                      ></textarea>
                    </div>
                  </div>
                )}
              </div>

              {submissionsOpen && (
                <button
                  onClick={handleUploadMeme}
                  class="w-full py-3.5 bg-orange-600 hover:bg-orange-500 font-bold rounded-xl active:scale-95 text-white text-xs shadow-lg flex items-center justify-center space-x-2"
                >
                  <i class="fa-solid fa-paper-plane"></i>
                  <span>Submit to Admin</span>
                </button>
              )}
            </div>
          )}

          {/* TAB 3: HALL OF FAME (SERVER-STITCHED MEME) */}
          {tab === 'hall' && (
            <div class="space-y-4">
              <h2 class="text-lg font-black mb-1 flex items-center space-x-2">
                <i class="fa-solid fa-trophy text-amber-500"></i>
                <span>Hall of Cooked</span>
              </h2>

              <div class="p-4 bg-slate-50 dark:bg-[#111622] rounded-2xl border border-slate-200 dark:border-[#1e2638] space-y-3 shadow-xl">
                {crownedMemeUrl && (
                  <div class="rounded-xl overflow-hidden shadow border border-slate-300 dark:border-gray-800">
                    <img src={crownedMemeUrl} class="w-full h-auto block" />
                  </div>
                )}

                <div class="flex justify-between items-center text-xs font-mono pt-1">
                  <span class="text-orange-600 dark:text-orange-400 font-bold"><i class="fa-solid fa-crown mr-1"></i>Active Champion</span>
                  <span class="text-gray-400">92% Win Rate</span>
                </div>

                <button
                  onClick={() => {
                    if (navigator.share && crownedMemeUrl) {
                      fetch(crownedMemeUrl).then(r => r.blob()).then(blob => {
                        const file = new File([blob], 'cooked-meme.png', { type: 'image/png' });
                        navigator.share({ title: 'Crowned on COOKED', files: [file] });
                      }).catch(() => alert('Saved image to clipboard!'));
                    } else if (crownedMemeUrl) {
                      const link = document.createElement('a');
                      link.download = `crowned-meme.png`;
                      link.href = crownedMemeUrl;
                      link.click();
                    }
                  }}
                  class="w-full py-2.5 bg-orange-600 hover:bg-orange-500 text-xs font-bold rounded-xl transition flex items-center justify-center space-x-2 text-white shadow"
                >
                  <i class="fa-solid fa-share-nodes"></i>
                  <span>Share Meme</span>
                </button>
              </div>
            </div>
          )}

          {/* TAB 4: PROFILE SETTINGS */}
          {tab === 'profile' && (
            <div class="space-y-4">
              <h2 class="text-lg font-black mb-1 flex items-center space-x-2">
                <i class="fa-solid fa-user-gear text-orange-500"></i>
                <span>Chef Profile</span>
              </h2>

              <div class="p-4 bg-slate-50 dark:bg-[#111622] rounded-2xl border border-slate-200 dark:border-[#1e2638] space-y-4 shadow-xl">
                <div class="flex items-center space-x-3">
                  <div class="w-14 h-14 bg-orange-100 dark:bg-orange-950/40 border border-orange-500/40 rounded-2xl flex items-center justify-center text-2xl text-orange-500">
                    <i class={`fa-solid ${avatar}`}></i>
                  </div>
                  <div>
                    <h3 class="font-black text-base">{username}</h3>
                    <p class="text-xs text-orange-500 font-mono font-bold">{title}</p>
                    <span class="text-[10px] text-gray-400 font-mono">Spices: {spices}</span>
                  </div>
                </div>

                <hr class="border-slate-200 dark:border-gray-800" />

                <div>
                  <label class="text-xs text-gray-500 font-medium block mb-1">Handle (Enforced Unique @)</label>
                  <input
                    type="text"
                    maxLength={16}
                    value={username}
                    onChange={handleHandleChange}
                    class="w-full bg-white dark:bg-black border border-slate-300 dark:border-gray-700 rounded-lg p-2.5 text-xs font-mono focus:outline-none focus:border-orange-500"
                  />
                  <p class={`text-[10px] font-mono mt-1 ${userStatus.includes('⚠️') ? 'text-red-500' : 'text-emerald-500'}`}>{userStatus}</p>
                </div>

                <div>
                  <label class="text-xs text-gray-500 font-medium block mb-1">Avatar</label>
                  <div class="grid grid-cols-5 gap-2">
                    {['fa-hat-chef', 'fa-fire', 'fa-skull', 'fa-cat', 'fa-crown'].map(ic => (
                      <button
                        key={ic}
                        onClick={() => setAvatar(ic)}
                        class={`h-10 rounded-lg border flex items-center justify-center text-sm ${
                          avatar === ic ? 'border-orange-500 bg-orange-50 dark:bg-orange-950/40 text-orange-500' : 'border-slate-200 dark:border-gray-800 text-gray-400'
                        }`}
                      >
                        <i class={`fa-solid ${ic}`}></i>
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <label class="text-xs text-gray-500 font-medium block mb-1">Chef Title</label>
                  <select
                    value={title}
                    onChange={(e) => setTitle(e.target.value)}
                    class="w-full bg-white dark:bg-black border border-slate-300 dark:border-gray-700 rounded-lg p-2 text-xs font-mono focus:outline-none focus:border-orange-500"
                  >
                    <option value="Line Cook">Line Cook (0 Spices)</option>
                    <option value="Sous Chef">Sous Chef (50 Spices)</option>
                    <option value="Head Chef">Head Chef (200 Spices)</option>
                    <option value="Michelin Menace">Michelin Menace (1,000 Spices)</option>
                  </select>
                </div>
              </div>
            </div>
          )}

          {/* TAB 5: ADMIN MASTER COCKPIT */}
          {tab === 'admin' && (
            <div class="space-y-4">
              {!isAdminAuth ? (
                <div class="p-6 bg-slate-50 dark:bg-[#111622] rounded-2xl border border-red-500/40 text-center space-y-4 shadow-2xl">
                  <i class="fa-solid fa-shield-halved text-4xl text-red-500"></i>
                  <h3 class="font-bold">Admin Verification</h3>
                  <input
                    type="password"
                    maxLength={4}
                    placeholder="Master PIN"
                    value={enteredPin}
                    onChange={(e) => setEnteredPin(e.target.value)}
                    class="w-36 bg-white dark:bg-black border border-gray-700 rounded-lg p-2.5 text-center text-xl font-mono focus:border-red-500 focus:outline-none"
                  />
                  <div>
                    <button
                      onClick={() => {
                        if (enteredPin === adminPin) { setIsAdminAuth(true); setEnteredPin(''); }
                        else alert('Access Denied');
                      }}
                      class="px-6 py-2.5 bg-red-600 font-bold rounded-xl text-xs text-white"
                    >
                      Authenticate
                    </button>
                  </div>
                  <p class="text-[10px] text-gray-400 font-mono">Default PIN: {adminPin}</p>
                </div>
              ) : (
                <div class="space-y-4 text-xs pb-10">
                  <div class="flex justify-between items-center bg-red-950/40 p-3 rounded-xl border border-red-800">
                    <span class="font-black text-red-400"><i class="fa-solid fa-radiation mr-1"></i>MASTER COCKPIT</span>
                    <button onClick={() => setIsAdminAuth(false)} class="text-[10px] bg-red-900/60 px-2.5 py-1 rounded font-bold text-white">Lock</button>
                  </div>

                  {/* Approve Submissions */}
                  <div class="bg-slate-50 dark:bg-[#111622] p-3.5 rounded-xl border border-slate-200 dark:border-[#1e2638] space-y-2">
                    <h4 class="font-bold uppercase tracking-wider text-[11px] text-orange-500">Meme Approval Queue</h4>
                    {pendingDrops.length === 0 ? (
                      <p class="text-emerald-500 font-mono text-[10px]">✨ Queue is clean!</p>
                    ) : (
                      pendingDrops.map(sub => (
                        <div key={sub.id} class="p-2.5 bg-white dark:bg-black/40 rounded-lg border border-slate-200 dark:border-gray-800 flex items-center justify-between space-x-2">
                          <img src={sub.image_url} class="w-12 h-12 object-cover rounded" />
                          <div class="flex-1 truncate">
                            <span class="font-bold text-[10px] text-orange-400 block">{sub.author}</span>
                            <span class="text-gray-400 text-[10px] truncate block">{sub.caption}</span>
                          </div>
                          <div class="flex space-x-1">
                            <button onClick={() => handleApproveSubmission(sub)} class="bg-emerald-600 text-white px-2 py-1 rounded text-[10px] font-bold">Approve</button>
                            <button onClick={() => setPendingDrops(pendingDrops.filter(x => x.id !== sub.id))} class="bg-red-600 text-white px-2 py-1 rounded text-[10px] font-bold">Reject</button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  {/* Custom Inbox Dispatcher */}
                  <div class="bg-slate-50 dark:bg-[#111622] p-3.5 rounded-xl border border-slate-200 dark:border-[#1e2638] space-y-2">
                    <h4 class="font-bold uppercase tracking-wider text-[11px] text-orange-500">Dispatch Inbox Message</h4>
                    <input
                      type="text"
                      placeholder="Target @handle"
                      value={customUser}
                      onChange={(e) => setCustomUser(e.target.value)}
                      class="w-full bg-white dark:bg-black border border-slate-300 dark:border-gray-700 rounded p-1.5 text-[10px] font-mono"
                    />
                    <input
                      type="text"
                      placeholder="Title"
                      value={customTitle}
                      onChange={(e) => setCustomTitle(e.target.value)}
                      class="w-full bg-white dark:bg-black border border-slate-300 dark:border-gray-700 rounded p-1.5 text-[10px]"
                    />
                    <textarea
                      placeholder="Message..."
                      value={customMsg}
                      onChange={(e) => setCustomMsg(e.target.value)}
                      class="w-full bg-white dark:bg-black border border-slate-300 dark:border-gray-700 rounded p-1.5 text-[10px] h-12 resize-none"
                    ></textarea>
                    <button onClick={handleSendInbox} class="w-full py-1.5 bg-orange-600 text-white font-bold rounded text-[10px]">Send Notification</button>
                  </div>

                  {/* Purge Username Locks */}
                  <div class="bg-slate-50 dark:bg-[#111622] p-3.5 rounded-xl border border-slate-200 dark:border-[#1e2638] space-y-2">
                    <h4 class="font-bold uppercase tracking-wider text-[11px] text-orange-500">Purge Username Lock</h4>
                    <button
                      onClick={async () => {
                        const target = prompt('Enter handle to purge (e.g. @chef_99):');
                        if (target && isLive) {
                          await supabase.from('user_profiles').delete().eq('username', target.trim().toLowerCase());
                          alert(`Purged ${target}!`);
                        }
                      }}
                      class="w-full py-2 bg-red-800 text-white font-bold rounded text-[10px]"
                    >
                      Delete Handle From Database
                    </button>
                  </div>

                  {/* Change PIN & Kill Switches */}
                  <div class="bg-slate-50 dark:bg-[#111622] p-3.5 rounded-xl border border-slate-200 dark:border-[#1e2638] space-y-2">
                    <h4 class="font-bold uppercase tracking-wider text-[11px] text-orange-500">Controls & Switches</h4>
                    <div class="flex justify-between items-center">
                      <span>Allow Submissions</span>
                      <input type="checkbox" checked={submissionsOpen} onChange={(e) => { setSubmissionsOpen(e.target.checked); if (isLive) supabase.from('app_config').update({ submissions_open: e.target.checked }).eq('id', 1); }} class="w-4 h-4 accent-orange-500" />
                    </div>
                    <div class="flex justify-between items-center">
                      <span>Enable Voting</span>
                      <input type="checkbox" checked={votingOpen} onChange={(e) => { setVotingOpen(e.target.checked); if (isLive) supabase.from('app_config').update({ voting_open: e.target.checked }).eq('id', 1); }} class="w-4 h-4 accent-orange-500" />
                    </div>
                    <div class="flex justify-between items-center">
                      <span class="text-red-400 font-bold">Maintenance Mode</span>
                      <input type="checkbox" checked={maintenanceMode} onChange={(e) => { setMaintenanceMode(e.target.checked); if (isLive) supabase.from('app_config').update({ maintenance_mode: e.target.checked }).eq('id', 1); }} class="w-4 h-4 accent-red-600" />
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}
        </main>
      )}

      {/* Inbox Notification Modal */}
      {showInbox && (
        <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white dark:bg-[#111622] border border-slate-200 dark:border-[#1e2638] w-full max-w-sm rounded-2xl p-5 space-y-3 shadow-2xl">
            <div class="flex justify-between items-center pb-2 border-b border-slate-200 dark:border-gray-800">
              <h3 class="font-black text-sm text-orange-500"><i class="fa-solid fa-inbox mr-1.5"></i>Inbox</h3>
              <button onClick={() => setShowInbox(false)}>✕</button>
            </div>
            <div class="max-h-60 overflow-y-auto space-y-2">
              {notifications.length === 0 ? (
                <p class="text-xs text-gray-400 text-center py-4">No notifications yet.</p>
              ) : (
                notifications.map((n, i) => (
                  <div key={i} class="p-2.5 bg-slate-50 dark:bg-black/40 rounded-xl border border-slate-200 dark:border-gray-800 space-y-1">
                    <p class="font-bold text-xs">{n.title}</p>
                    <p class="text-[11px] text-gray-500">{n.message}</p>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      )}

      {/* Bottom Bar */}
      <nav class="h-16 bg-white dark:bg-[#111622] border-t border-slate-200 dark:border-[#1c2433] flex items-center justify-around fixed bottom-0 left-0 right-0 max-w-md mx-auto z-10">
        <button onClick={() => setTab('duel')} class={`flex flex-col items-center ${tab === 'duel' ? 'text-orange-500' : 'text-gray-400'}`}>
          <i class="fa-solid fa-fire text-lg"></i>
          <span class="text-[10px] font-bold mt-1">Duel</span>
        </button>
        <button onClick={() => setTab('cook')} class={`flex flex-col items-center ${tab === 'cook' ? 'text-orange-500' : 'text-gray-400'}`}>
          <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
          <span class="text-[10px] font-bold mt-1">Upload</span>
        </button>
        <button onClick={() => setTab('hall')} class={`flex flex-col items-center ${tab === 'hall' ? 'text-orange-500' : 'text-gray-400'}`}>
          <i class="fa-solid fa-trophy text-lg"></i>
          <span class="text-[10px] font-bold mt-1">Hall</span>
        </button>
        <button onClick={() => setTab('profile')} class={`flex flex-col items-center ${tab === 'profile' ? 'text-orange-500' : 'text-gray-400'}`}>
          <i class="fa-solid fa-user-gear text-lg"></i>
          <span class="text-[10px] font-bold mt-1">Profile</span>
        </button>
      </nav>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
